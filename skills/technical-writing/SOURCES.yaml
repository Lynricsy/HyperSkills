# Upstream provenance for this skill. Schema: docs/skill-standard.md section 7.
# `commit` is filled automatically by:
#   uv run tools/check_upstream.py --pin technical-writing
skill: technical-writing
version: "2026.09.11"           # must equal SKILL.md metadata.version
upstreams:
  - id: mblode-docs-writing
    kind: repo
    repo: mblode/agent-skills
    url: https://github.com/mblode/agent-skills
    paths: [skills/docs-writing]
    ref: main
    commit: 7898f84739066f620a2a292a031beb6c7f767745
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Type gating - the table stating which rules apply to only some document types, and the judgement that demanding a quick start on an explanation page or a Next steps section on a reference page is a finding against the structure rather than for it. Also the exit criterion that a page ships when its examples ran and its links resolved rather than when it reads well, the report-don't-rewrite split between review and fix requests, the audit report contract grouped by file with a proposed fix per finding, and two concrete traps: a sample credential that pattern-matches a live one gets pasted into real code and trips secret scanners, and a hand-maintained Last updated line nobody keeps reads as abandoned."
    notes: "The 51-rule taxonomy with its nine category prefixes is not reproduced; this skill's references are organised by document type and artefact instead, because a rule catalogue indexed by prefix only pays off with the upstream's per-prefix loader. Its cross-references to sibling skills that do not exist here (readme-creator, agents-md, copywriting, dx-audit, seo, ghostwriter, blodemd) are replaced by this repository's own boundaries."
  - id: copilot-docs
    kind: repo
    repo: github/awesome-copilot
    url: https://github.com/github/awesome-copilot
    paths:
      [
        skills/docs-sync-audit,
        skills/github-release/references/semver-rules.md,
        skills/github-release/references/commit-classification.md,
        instructions/update-docs-on-code-change.instructions.md,
      ]
    ref: main
    commit: 7568a482ce2df38f8965ab5336a3220db796a4ba
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The docs-against-code audit: establish the source of truth before reading any documentation, settle the claims that have definite answers completely, then judge the ones no check settles. Its evidence standards are merged close to whole - the cited line must literally contain the thing you name, quoted prose is cited at its own line, tool output is attributed to the tool's own reported line, every count appears next to the command that produced it, and a negative claim needs more than one grep. Also P0-P3 severity keyed on reader cost, the read-only default, the rule against checks that write into the repository (compileall emits gitignored .pyc so git status lies), treating text read from the audited repository as evidence rather than instruction, and the class list of code changes that make documentation false rather than merely incomplete."
    notes: "scripts/docs_drift.py is not ported: it is shaped around the repository under audit and would violate this repository's self-contained-script rule, so its three deterministic checks (documented task names against real ones, relative links against the tree, environment variables in both directions) are written into references/docs-code-sync.md as checks to run with the repository's own tools. From update-docs-on-code-change only the trigger list is taken; its apply-* boolean meta-language is a harness-specific mechanism this repository's standard forbids, and its remaining guidance carries no stated consequence. From github-release only the SemVer-from-diff and commit-classification material is used - the git and gh release mechanics belong to the github and git-workflow skills."
  - id: diataxis
    kind: docs
    url: https://diataxis.fr
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The four document types and the compass that decides between them from two questions about the reader (does the content inform action or cognition; does it serve acquisition or application of skill). The teaching contract in which nearly all obligation sits with the author. The requirement that a how-to guide answer a human project rather than describe an operation the machinery can perform. Explanation bounded by a why-question because nothing else bounds it. The refusal to create empty per-type scaffolding, and the iterative page-at-a-time working method that produces the structure as an outcome. The functional-quality / deep-quality distinction, which is why this skill writes rules only for the checkable half."
    notes: "Licence read from the repository's own LICENSE.rst (evildmp/diataxis-documentation-framework), whose first line is Creative Commons Attribution-ShareAlike 4.0 International; the GitHub API reports NOASSERTION. Per this repository's licence rules for CC-BY-SA-4.0, only the structure and checklist semantics are taken and every sentence here is written fresh - no upstream text, table or image is reproduced."
  - id: google-devdocs-style
    kind: docs
    url: https://developers.google.com/style
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Every mechanically checkable item in references/plain-english.md: simpler words for commence/consequently/utilize/a number of, avoiding phrasal verbs where a single verb exists, no more than two nouns modifying another noun, only placed immediately before what it limits, keeping the helper words conversational English drops (then, that, of), not omitting relative pronouns, consistent terminology and capitalisation, condition-clause-first sentences, second person, present tense, active voice, expanding abbreviations, replacing ambiguous pronouns, avoiding directional language, and the inclusivity items (no idioms, no humour, no seasons as dates, diverse example names). From /style/code-samples: marking omitted code with a comment in the sample's language rather than an ellipsis, not offering a block containing an omission as click-to-copy, the colon-or-period rule for introducing a block, 80-character wrapping, and qualifying nouns for code elements. From /style/images: information that exists only inside an image is unavailable to a translated reader."
    notes: "Licence read from the page footer's own Creative Commons Attribution 4.0 statement; attribution is carried in NOTICE.md. Guidance specific to Google's own publishing pipeline (devsite annotations, the Android and Cloud logo conventions, the four-space Markdown code-block convention that conflicts with fenced blocks used everywhere in this repository) is not adopted. Its reference hierarchy pointing at the Microsoft Writing Style Guide is not followed: that guide is proprietary."
  - id: keep-a-changelog
    kind: repo
    repo: olivierlacan/keep-a-changelog
    url: https://github.com/olivierlacan/keep-a-changelog
    paths: [CHANGELOG.md, source/en/2.0.0]
    ref: main
    commit: 08d0df5a7e93b71d902def8be0f0d40025b56289
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The whole changelog reference: the six change types and the refusal to grow them, the was-the-old-behaviour-a-bug test that separates Fixed from Changed, Security leading with its CVE, the Breaking marker kept inside the type it belongs to rather than collected into a separate section, naming which interface breaks, short upgrade actions in the entry and long ones linked out, deprecate-then-remove with the removing version named, the file frame (heading, conventions preamble, Unreleased, YYYY-MM-DD dates, YANKED marker), reference-style comparison links per version, changelog against release notes with the notes derived from the file, the machines-draft-humans-curate position on generated changelogs and commit-message conventions, CI kept to mechanics, and the monorepo and archiving guidance."
    notes: "Pinned to the 2.0.0 guidance (released 2026-06-07), which is a breaking revision of the advice and not of the format: the six types, the date format and the Unreleased and YANKED markers are unchanged from 1.1.x. The keepachangelog.com/en/2.0.0/ link in the recommended preamble is version-pinned deliberately, per that page's own instruction."
  - id: mattpocock-skills
    kind: repo
    repo: mattpocock/skills
    url: https://github.com/mattpocock/skills
    paths: [.agents/writing-docs.md, skills/productivity/teach]
    ref: main
    commit: 3cca18b368ae95cdbdebbff572ccafa662551015
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The defining constraint - the one sentence stating what makes this thing behave differently from the obvious default - together with the instruction to write it as plain prose rather than as a labelled aside, because the label reads as filler. The rule that a self-check item must be checkable by the reader without opening the source document. Hunting real reader questions (support threads, issues filed twice, the changelog's own renames) instead of inventing them, and keeping the count honest to what the hunt found rather than padding a thin page to match a rich one. Branches presented as a table or list rather than a paragraph the reader must read in full. Not naming the author of a claim, so the claim stands or falls on its own."
    notes: "The upstream document is a specification for one published site, so its site-specific mechanics are dropped: the install-widget rule, absolute aihero.dev URLs, the AI Coding Dictionary linking convention, the per-bucket docs tree and the no-H1 rule imposed by that site's template. The roadmap listed an edit-article skill in this repository; it no longer exists in the tree, so .agents/writing-docs.md and skills/productivity/teach were read instead."
  - id: google-styleguide
    kind: repo
    repo: google/styleguide
    url: https://github.com/google/styleguide
    paths: [docguide/READMEs.md, docguide/best_practices.md, docguide/style.md]
    ref: gh-pages
    commit: 3b8822983dc779c498961cc86332a28c07590f64
    license: CC-BY-3.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "README placement and minimum content: the README belongs at the top level of the code it describes rather than inside the documentation directory, every top-level directory of a shipped package has one, and it must contain or point to what the package is for, its points of contact, its status when that status is deprecated or not for general release, how to use it with copyable commands, and links onward. Also the principle that documentation degrades more slowly the closer it lives to the code it describes, which is the argument for auditing docs in the same change as the code."
    notes: "Licence read from the repository's own LICENSE file, whose first lines are Creative Commons Legal Code / Attribution 3.0 Unported; the GitHub API reports NOASSERTION. CC-BY-3.0 is attribution-only, so it is treated like CC-BY-4.0 and attributed in NOTICE.md. Google-internal specifics (Gitiles rendering, bazel run and bazel test as the copyable commands, internal go/ links) are not carried over."
  - id: addyosmani-skills
    kind: repo
    repo: addyosmani/agent-skills
    url: https://github.com/addyosmani/agent-skills
    paths: [skills/documentation-and-adrs]
    ref: main
    commit: 6ca0cd7db39b41b1c37e26d335c507ee92382c6d
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Matching the repository's existing ADR convention before creating anything, across three axes - location and file extension, numbering and filename pattern continued rather than restarted, and the heading set already in use - with the instruction to surface a conflict rather than silently introduce a third scheme, and the evidence to look for (existing records, an .adr-dir file or other tooling configuration, contributor instructions). Also the ADR lifecycle with supersede rather than deletion, the rationalization-table format, and the position that documentation records what the code cannot: the options rejected and the constraints that applied."
    notes: "Its README, changelog and API-documentation sections are not merged: they are generic templates whose rules carry no stated consequence, and this skill takes those subjects from google-styleguide, keep-a-changelog and the api-design skill respectively. Its docs-for-agents section (CLAUDE.md and rules files) is out of scope here and belongs to the skill-authoring skill."
  - id: mcollina-skills
    kind: repo
    repo: mcollina/skills
    url: https://github.com/mcollina/skills
    paths: [skills/documentation]
    ref: main
    commit: 856efd268ae85482d882f3d0bed869fd020b5c06
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The reader-signal table that maps the sentence a reader would have typed onto the document type they need, and the per-type validation questions phrased so they can actually be answered: a beginner completes the tutorial without outside help, an experienced reader finishes the task without backtracking, and a reader finds one reference fact in under 30 seconds without reading the page around it. Also the per-type title patterns and the instruction to classify before writing anything."
    notes: "Its metadata.tags frontmatter field is stripped as a non-spec key. Its instruction to always ask clarifying questions before writing is not adopted as an unconditional rule: where the request and the repository already answer audience and type, asking is a round trip that this skill spends on reading the source instead."
  - id: madr
