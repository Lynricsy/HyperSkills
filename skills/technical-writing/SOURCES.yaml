  - id: github-writing-docs
    kind: docs
    url: https://docs.github.com/en/get-started/writing-on-github
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Every [official] statement about what a forge actually renders: the heading-slug rule that letters are lower-cased, spaces become hyphens and all other punctuation is removed - which is what makes an emoji heading slug start with a hyphen; custom anchors being excluded from the generated outline; the automatically generated table of contents from headings, which is the argument against a hand-written one on a short file; <picture> with prefers-color-scheme and the instruction that the inner <img> is the fallback and must carry the alt text; <details> and its open attribute; the alerts syntax together with the guidance to use them only when crucial, to keep to one or two per page and never to place them consecutively or nested; mermaid, geoJSON, topoJSON and STL fenced blocks; the recommendation to use relative links inside a repository; the README lookup order .github then root then docs; the 500 KiB rendering truncation; and the upload limits and supported media types, including H.264 for video compatibility."
    notes: "Licence per the GitHub Docs repository's own terms for documentation content (CC BY 4.0); attribution is carried in NOTICE.md. No text is reproduced - each statement was re-derived and rewritten. The relative-link recommendation is adopted only for files that are never published to a package registry: measurement shows relative paths do not resolve on a registry page, and that conflict is settled in references/readme-portability.md rather than by following either source unconditionally. Profile-README material on those pages is out of scope for this skill."
  - id: pypa-readme
