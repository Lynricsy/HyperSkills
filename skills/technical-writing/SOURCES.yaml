    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "That a Python package's project page is rendered from the README named by the manifest, that the renderer is readme_renderer rather than the forge's, and that twine check is the pre-upload way to find out what the page will look like. This is the basis for treating the README as a multi-renderer artefact rather than a repository page."
    notes: "Licence per the PyPA packaging guide's own CC BY-SA 4.0 terms; no text reproduced. The page does not document which HTML survives the renderer, so the support matrix in references/readme-portability.md was measured directly with readme_renderer and the reproduction commands are recorded in research/technical-writing-readme-presentation.md."
  - id: standard-readme
    kind: repo
    repo: RichardLitt/standard-readme
    url: https://github.com/RichardLitt/standard-readme
    paths: [spec.md]
    ref: main
    commit: 0ebca6e613f215dd4111debd512670065e7ecbd8
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The checkable first-screen constraints: the short description is under 120 characters, sits on its own line, and matches both the package manager's description field and the forge's repository description - a cross-artefact invariant nothing else in this skill covered. Also that a banner and a badge block carry no heading of their own and sit directly under the title, that badges are newline-delimited, that a banner links to an image committed in the repository, and that a table of contents is expected once a file passes roughly a hundred lines and should capture every second-level heading."
    notes: "Its suggestion that a static badge be hosted locally to avoid tracking is adopted only in part: measurement shows the forge and both package registries fetch badge images through their own proxies, so the reader's address is not exposed there. The reason to commit a badge is the cache and the outage, and that is what references/badges-and-widgets.md says. The specification's fixed section order and its own compliance badge are not adopted; this skill orders a README by what a reader needs first."
  - id: awesome-readme-skill
    kind: repo
    repo: fralapo/awesome-agent-skills
    url: https://github.com/fralapo/awesome-agent-skills
    paths: [skills/awesome-readme]
    ref: main
    commit: 759a6a82b079b3ffca7bd14ece0a541c29c2d85e
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The coverage map for README presentation, which is what this skill was missing: first-screen composition as an ordered set of decisions, visual assets by project type, collapsed sections, tables of contents, badge grouping and style consistency, and an explicit anti-AI-prose pass on every draft. Its structural anti-pattern list contributed the ones that carry a stated consequence: unfilled template placeholders, broken image links, empty and coming-soon sections, dead badge services, and reference-style link definitions belonging at the bottom of the file."
    notes: "A second-hand compilation - zero stars, self-described as mined from the repositories listed in its own frontmatter - so every claim was taken from the first-hand source instead and several were refuted. Three of its rules are not adopted. Its back-to-top anchor pattern, copied from Best-README-Template, is a construct whose rendered HTML does not resolve. Its cap of five to eight badges is an unsupported number, replaced by the fold, dependency and discrimination criteria. Its one-em-dash-per-section rule contradicts its own cited upstream, which reports em-dash frequency as a weak signal and the spacing around them as the usable one. Its profile-README reference is out of scope here. Its templates and examples files are not merged: a template per project type is the kind of scaffolding this skill's standard rejects."
  - id: wikipedia-ai-signs
    kind: docs
    url: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The whole structure of references/human-voice.md: the split between structural tells that survive model changes and lexical ones that decay, copula avoidance, the trailing present-participle pseudo-analysis, undue emphasis on significance and broader trends, vague attribution and overgeneralised opinion, the rule of three, the negative-parallelism family, the challenges-and-future-prospects ending, section summaries, and the mechanical signals - spaced em dashes, mixed curly and straight quotation marks, title case in headings, thematic breaks between every section, and assistant markup leftovers such as oaicite, [cite: 1] and utm_source=openai. Also the two caveats that keep the page honest: detection tools have non-trivial error rates and people who do not use these models heavily perform at about chance, so the page is written as an editing pass rather than an accusation."
    notes: "Licence is Wikipedia's CC BY-SA 4.0. Handled the same way as diataxis in this file: structure and semantics only, every sentence written fresh, no table, list or example text reproduced. Two of its findings correct the awesome-readme-skill upstream: em-dash frequency is a weak indicator and one current model uses them less than professional writers, and the bolded-lead bullet list is a habit inherited from READMEs, so flagging it inside a README is a false positive. Its Wikipedia-specific signs - wikitext bugs, category and template hallucination, Articles-for-Creation artefacts, edit-summary patterns - are not carried over."
