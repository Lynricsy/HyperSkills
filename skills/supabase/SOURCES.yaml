    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The Supabase-specific security checklist: user_metadata is user-editable and unsafe for authorization, deleting a user does not invalidate issued tokens, views bypass RLS without security_invoker, an UPDATE needs a SELECT policy or it silently affects zero rows, auth.role() is deprecated and breaks once anonymous sign-ins exist, TO authenticated alone is BOLA, SECURITY DEFINER bypasses RLS and is callable by PUBLIC when it lives in public, Storage upsert needs three privileges. Also the Data-API-exposure-versus-RLS layering, the declarative-versus-imperative schema decision, and db advisors as the pre-commit gate."
    notes: "Official skill, frontmatter carried only name/description/metadata so nothing agent-specific needed stripping. Two of its claims were overruled: its CLI version floors (db query 2.79+, db advisors 2.81.3+) are dead weight at CLI 2.117 and are omitted per the no-time-sensitive-wording rule, and its 'UPDATE without WITH CHECK lets a user reassign user_id' is factually wrong on any supported Postgres (research/supabase.md ruling 11)."
