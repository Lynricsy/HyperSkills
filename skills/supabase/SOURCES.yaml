    kind: docs
    url: https://supabase.com/docs
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Every version-sensitive fact in this skill: the publishable/secret key system and how to recognise the legacy eyJ-prefixed pair, grants evaluated before RLS with 42501 versus an empty result, the getClaims/getUser/getSession split, the getAll/setAll cookie adapter and the cache headers setAll must write, the withSupabase entry point with its auth modes and ctx clients, SUPABASE_SECRET_KEYS as an injected dictionary, the four Edge Function limits, Realtime channel authorization on realtime.messages plus the Postgres-Changes-versus-Broadcast thresholds, realtime.broadcast_changes, the declarative-diff blind-spot list, private-bucket signed URLs and their independent signing key, custom claims through the access-token hook, and gen types."
    notes: "Licence verified by reading the source repository: the docs content lives in supabase/supabase under apps/docs, that repository's root LICENSE is Apache-2.0 and apps/docs carries no separate LICENSE, so this is merged rather than reference. Pages were read as plain text by appending .md to each docs path."
