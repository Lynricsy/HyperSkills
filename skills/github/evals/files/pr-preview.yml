name: PR preview

# Runs after "CI" (on: pull_request) finishes, so it has secrets and a write token
# even for pull requests from forks.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Safe since the 2026-06-18 checkout change: checkout refuses fork code under
      # workflow_run, so this can only ever check out our own branches.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build preview
        run: |
          npm ci
          npm run build:preview

      - name: Upload preview
        run: npx wrangler pages deploy dist --project-name docs-preview --branch "pr-${{ github.event.workflow_run.pull_requests[0].number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  screenshot:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out the PR for screenshots
        run: gh pr checkout "${{ github.event.workflow_run.pull_requests[0].number }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Take screenshots
        run: |
          npm ci
          npx playwright test --project=screenshots
