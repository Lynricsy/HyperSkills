  - id: github-docs
    kind: docs
    url: https://docs.github.com
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Authoritative source for every fact where community upstreams were out of date or wrong: actions/checkout now refuses fork PR head refs under pull_request_target unless allow-unsafe-pr-checkout is set; pull_request_target runs get read-only cache access in the default branch scope; the checkout step is not itself the pwn request, the step that executes the code is; SHA pinning as the only immutable action reference plus the repository/organisation pinning policy and workflow execution protections; OIDC and the id-token: write requirement; secret redaction limits for transformed and structured secrets; closing keywords are interpreted only when the pull request targets the default branch; CODEOWNERS location, base-branch requirement, write-access requirement, last-match-wins ordering, co-owners on one line, and the unsupported gitignore constructs; rulesets aggregate with no priority so the most restrictive version of a rule wins, enforcement statuses, and per-rule behaviour including metadata restrictions blocking ref updates; immutable releases, release attestations and the draft-then-publish order."
    notes: "Content of docs.github.com is licensed CC-BY-4.0 in its source repository github/docs (code samples are MIT); attribution: \"GitHub Docs\" by GitHub, Inc., used under CC BY 4.0. No text was copied verbatim. Pages consulted: actions/reference/security/secure-use, actions/reference/security/securely-using-pull_request_target, actions/concepts/security/script-injections, actions/concepts/security/github_token, repositories/.../managing-rulesets/about-rulesets, repositories/.../managing-rulesets/available-rules-for-rulesets, repositories/.../customizing-your-repository/about-code-owners, issues/.../linking-a-pull-request-to-an-issue, code-security/concepts/supply-chain-security/immutable-releases."
