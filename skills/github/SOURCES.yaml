    contributes: "The audit threat model — report only what an attacker without write access can reach — plus the five-element evidence requirement (entry point, payload, execution mechanism, impact, reproduction) and the safe-patterns list that must not be reported. The pull-request body contract: a reviewer-facing cover note, conventional title types, no default Summary/Changes/Test Plan scaffolding, no pasted validation output. The CI waiting rule that separates checks which can still change from human gates (approval, draft, REVIEW_REQUIRED, coverage reporters). Read the PR body before editing it so bot-maintained sections survive. The review-queue read path via gh api notifications plus requested_reviewers and team membership."
