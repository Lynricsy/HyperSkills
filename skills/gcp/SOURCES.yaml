    kind: docs
    url: https://cloud.google.com/docs
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The authority for every product fact in this skill that the local CLI cannot show: the Cloud Run concurrency default of 80 x vCPU for CLI/Terraform-created services versus a flat 80 in the console and the ceiling of 1000, the 300 s / 3600 s request timeout pair, request-based versus instance-based billing and what silently does not run under the default, the gen1/gen2 execution environment trade-off; the IAM propagation figures (typically 2 minutes, potentially 7 minutes or longer), the 2024-05-03 boundary for iam.automaticIamGrantsForDefaultServiceAccounts, the rule that conditions cannot attach to basic roles or to allUsers/allAuthenticatedUsers, that custom roles cannot exist at folder level, and that deny policies are checked before allow policies; Cloud Storage minimum storage durations (Nearline 30 / Coldline 90 / Archive 365) plus the Rapid class, strong global consistency, the 24-hour lifecycle propagation window, soft delete on by default at 7 days and billed, and Autoclass's fee structure; Cloud Logging retention per bucket type (_Required 400 days non-configurable, _Default 30 days, folder/org buckets non-extendable), the $0.50/GiB ingestion price with 50 GiB free per project per month, and the Cloud Monitoring quota table; GKE Autopilot's 0.25 vCPU / 0.5 GiB minimum and 1:1-to-1:8 ratio, the 110-Pods-per-node default with a /24 per node, the $0.10 per cluster per hour management fee, the $74.40 free-tier credit that excludes the regional cluster fee, the $0.50/hour extended-support surcharge, and the surge versus blue-green upgrade strategies; the six Architecture Framework pillars; and the statement that an alerts-only budget does not cap spending."
    notes: "Licence verified by reading the page footer of cloud.google.com pages (for example /run/docs/deploying) and developers.google.com/site-policies: page content is CC-BY-4.0 and code samples Apache-2.0. Attribution: portions of this skill are derived from Google Cloud documentation, used under CC-BY-4.0; no text is copied verbatim. Where a figure could be checked against the local Google Cloud SDK 584.0.0 it was, and the CLI reading wins - the docs and the CLI disagree on nothing material, but the CLI is the version actually installed."
