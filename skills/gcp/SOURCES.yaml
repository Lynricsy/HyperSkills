    relation: merged
    synced_at: "2026-09-11"
    contributes: "The CLI discipline this skill's Core rules are built on: leaf-level `gcloud help` validation being non-transitive, the ban on unscoped `list` commands, `--quiet` as a hard requirement in headless environments, explicit `--project` and location scoping, and the human-approval denylist (IAM mutation, delete, billing, organizations, kms, and proactive `services enable`). From the IAM helpers: the v1-allow / v2-deny two-paradigm model, deny-policy attachment points, the plan-then-confirm protocol for mutating policy changes, the refusal to grant basic roles to allUsers/allAuthenticatedUsers, and the ordering that puts Policy Troubleshooter after checking deny and organization policy. From gke-cluster-creation: Autopilot as the golden path and the concrete hardened `create-auto` flag set (private nodes, master authorized networks, DNS access, Secret Manager rotation, release channel). From cloud-logging-query-generation: the LQL hard rules - double quotes only, uppercase booleans, gce_instance name-versus-id confusion, internal_http_lb_rule rather than http_load_balancer, and SEARCH() rather than `=` or `:` for protoPayload.methodName. From cloud-run-basics: the service / job / worker-pool split, the required deploy roles, and the job flag defaults. From the WAF skills: the six-pillar review structure and the product mapping under each."
    notes: "Repository LICENSE read directly and confirmed to be the Apache-2.0 full text, not merely the API's spdx_id. The non-standard `metadata.category` values (CloudInfrastructureAndServices, Serverless, Databases, WellArchitectedFramework, Security, Containers) were stripped per docs/skill-standard.md section 1.2, as were the MCP tool-name blocks (list_clusters, create_cluster, run_gcloud_command, search_documents). Two upstream positions were not adopted: the gcloud skill's rule 4, which forbids web search for gcloud syntax, is a Gemini CLI product constraint rather than an engineering fact and was re-expressed as 'the installed release's help output is the authority'; and its ALL-CAPS MANDATORY/FORBIDDEN register was dropped per docs/skill-standard.md section 3. The GKE skills' manifest-layer material (gke-manifest-generation, gke-app-onboarding, gke-workload-*) was deliberately excluded - gke-app-onboarding was already used by the `containers` skill, and Kubernetes manifests are that skill's scope. cloud-run-basics does not cover concurrency defaults, traffic splitting or the --min/--min-instances distinction; those came from the documentation and the local CLI instead."
