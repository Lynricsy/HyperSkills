apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  labels:
    app: image-resizer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      containers:
        - name: resizer
          image: registry.internal.example/media/resizer:2.4.1
          ports:
            - containerPort: 8080
          env:
            - name: QUEUE_URL
              value: amqp://broker.media.svc.cluster.local:5672
---
apiVersion: v1
kind: Service
metadata:
  name: image-resizer
spec:
  selector:
    app: image-resizer
  ports:
    - port: 80
      targetPort: 8080
