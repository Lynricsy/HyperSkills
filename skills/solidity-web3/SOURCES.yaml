skill: solidity-web3
version: "2026.09.12"
upstreams:
  - id: pashov-auditor
    kind: repo
    repo: pashov/skills
    url: https://github.com/pashov/skills/tree/main/solidity-auditor
    paths: [solidity-auditor]
    ref: main
    commit: c577eb7799c349de0acb187ba00ca98e14e436fd
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The vulnerability taxonomy an EVM review has to cover, taken from its twelve specialty hunting agents and reorganised into this skill's topic references: rounding direction per quantity, zero-truncation and divide-before-multiply, decimal mismatch, narrow downcasts, first-depositor share inflation, initialize hijack and front-running, role escalation and renounce-bricking, proxy storage and admin-slot collisions, single-block oracle reads, ERC-4626 and permit edge cases, sentinel addresses in token operations, and conservation, round-trip and view-versus-write invariants. Also its evidence discipline: a claim without a demonstrated attack path is a lead, not a finding."
    notes: "Its Claude-Code-specific orchestration (twelve background agents, AskUserQuestion model selection, bundle directories), the confidence-scoring arithmetic and the vendor banner were dropped — this skill is written for one agent doing one review. One upstream claim was corrected rather than carried: judging.md lists explicit narrowing casts as safe on 0.8 because they 'revert on overflow'; measured locally, uint128(2**128 + 7) returns 7 with no revert, so the cast rule here says the opposite."

  - id: pashov-fizz
    kind: repo
    repo: pashov/skills
    url: https://github.com/pashov/skills/tree/main/fizz
    paths: [fizz]
    ref: main
    commit: c577eb7799c349de0acb187ba00ca98e14e436fd
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The shape of a fuzz harness that actually exercises the protocol: the clamped/unclamped handler split, bounding inputs instead of rejecting them, acting-actor modifiers, explicit donation handlers that move value without going through an entry point, ghost variables and before/after snapshots held outside the contract, and boundary-value stress variants."
    notes: "Its Echidna/Medusa-first pipeline and its twenty-five vendored scripts and templates were not carried over: this skill makes Foundry's own invariant engine the default for in-repo CI and names the two campaign fuzzers as the deep-campaign escape hatch. Its cost estimates and coverage-percentage targets were dropped as time-sensitive."

  - id: pashov-xray
    kind: repo
    repo: pashov/skills
    url: https://github.com/pashov/skills/tree/main/x-ray
    paths: [x-ray]
    ref: main
    commit: c577eb7799c349de0acb187ba00ca98e14e436fd
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Two things: the per-protocol-type invariant catalogue (lending, AMM, vault, stablecoin, perps, liquid staking, bridge, governance) that seeds the invariant table, and the discipline that a guard is not an invariant — a property lifted from one guard that another write site fails to enforce is simultaneously an invariant and a candidate bug. Also the rule that a row you cannot verify is dropped rather than marked unverified."
    notes: "Its three bundled scripts (~90 KB of Python and bash), its TodoWrite coupling and its generated report layout were not carried over."

  - id: tob-secure-contracts
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/building-secure-contracts
    paths: [plugins/building-secure-contracts]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The non-standard-ERC20 catalogue as a checklist semantic — missing return values, fee-on-transfer, balance changes outside transfers, blocklists, pausability, unusual decimals, revert-on-zero, approval-race protection, non-string metadata, multiple token addresses — plus the code-maturity axes used to decide what a review must cover (arithmetic, access control, complexity, decentralization, transaction ordering, low-level manipulation, testing) and the Slither-first ordering of the cheap passes."
    notes: "CC-BY-SA-4.0 is share-alike and incompatible with this repository's MIT licensing, so no prose, table or code block was copied — only the checklist semantics, rewritten, with every tool fact re-measured locally against Slither 0.11.6. Three upstream claims were deliberately not carried: increaseAllowance/decreaseAllowance as the approval-race mitigation (removed from OpenZeppelin ERC20 in 5.0), Manticore as a recommended tool (unmaintained), and slither-prop presented as Truffle-gated. Its detector count ('70+') was replaced with the measured 102. The plugin contains no Solidity or EVM vulnerability-scanner skill despite its name; its per-chain scanners are for Algorand, Cairo, Cosmos, Solana, Substrate and TON."

  - id: tob-property-testing
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/property-based-testing
    paths: [plugins/property-based-testing]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The two ways a property test fails to be a test — tautology (restating the implementation) and vacuity (filtering out nearly every input) — with the Solidity-specific tautologies that look like properties (an unsigned value being non-negative, a balance being non-negative); the property strength ordering that says to assert the strongest shape the code supports; the position that code with no algebraic structure gets example-based tests and that saying so is a valid outcome; and the Echidna constraint that a property function must be view or pure and take no arguments."
    notes: "Share-alike; semantics only, all wording original. The skill is polyglot and deliberately excludes Foundry's invariant engine — that half of this skill's invariant reference is measured locally instead."

  - id: oz-contracts
    kind: repo
    repo: OpenZeppelin/openzeppelin-contracts
    url: https://github.com/OpenZeppelin/openzeppelin-contracts
    paths: [contracts/access, contracts/proxy, contracts/utils, contracts/token/ERC20]
    ref: master
    commit: 6bc7bf38645e87468779c8118f6ba4b8bc6d4067
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Every 5.x API shape asserted in this skill was read out of the installed v5.7.0 source and then exercised in a local test: the mandatory Ownable(initialOwner) constructor, the custom-error set (OwnableUnauthorizedAccount, OwnableInvalidOwner, ERC20InsufficientBalance, ERC20InsufficientAllowance, ReentrancyGuardReentrantCall, InvalidInitialization, AccessControlUnauthorizedAccount), the move of ReentrancyGuard and Pausable from security/ to utils/, ReentrancyGuardTransient and its EIP-1153 requirement, _reentrancyGuardEntered as the read-only-reentrancy hook, Initializable's ERC-7201 storage location and _disableInitializers, the removal of __UUPSUpgradeable_init and upgradeTo, ERC1967Utils.IMPLEMENTATION_SLOT, SafeERC20 including forceApprove and the removal of safeApprove, Math.mulDiv, and SafeCast."
    notes: "Pinned at v5.7.0 (tag commit cab19933c33c2ad1d4c7a84864a3601dddfd16f3) for the measurements; ref/commit track master so check_upstream sees API changes. Also recorded: in 5.7.0 the upgradeable package's proxy/utils/Initializable.sol and UUPSUpgradeable.sol are two-line re-export shims, which is why a project must remap both packages."

