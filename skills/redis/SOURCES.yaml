    url: https://github.com/redis/redis-py
    paths: [redis/connection.py, redis/client.py, redis/cluster.py]
    ref: master
    commit: 41585545ee8284d3a51797fdfa1ff995866ab558
    license: MIT
    relation: reference
    synced_at: "2026-09-11"
    contributes: "Read to cross-check the client-side defaults this skill asserts: that socket_timeout and socket_connect_timeout are unset unless given, how a connection pool leases and blocks, and how RESP3 plus a cache config turns on client-side caching."
    notes: "No client API is taught here - that belongs to the framework skills. Only the defaults that change server-visible behaviour were taken, and each is stated as a property of the connection rather than of a particular library."
