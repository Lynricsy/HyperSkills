    url: https://github.com/redis/redis
    paths: [LICENSE.txt, redis.conf]
    ref: "8.10"
    commit: 3399357e7c17b668289386b8a15a3037bc4527b1
    license: AGPL-3.0-only OR SSPL-1.0 OR RSALv2
    relation: reference
    synced_at: "2026-09-11"
    contributes: "Read to establish which major line is current (the releases endpoint shows 8.10.1 as the newest non-prerelease, alongside maintained 8.8.x, 8.6.x, 8.4.x, 8.2.x, 7.4.x, 7.2.x and 6.2.x lines) and to settle the licensing question that surrounds Redis itself."
    notes: "LICENSE.txt read in full: from Redis 8 the server is tri-licensed under your choice of the Redis Source Available License v2, the Server Side Public License v1, or AGPLv3, with 7.2 and earlier remaining BSD-3-Clause. None of the three is an acceptable licence for merged content, so this is reference-only. Server defaults quoted in this skill were not taken from redis.conf but measured with CONFIG GET against a local redis:8-alpine instance reporting redis_version 8.10.1, which is also why the licence of the source tree never touches this skill's text."
