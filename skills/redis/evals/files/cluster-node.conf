# redis-cluster node config, rendered by our Ansible role for all 6 nodes
# (3 primaries + 3 replicas). Redis 8.10.2 from the official image.
#
# Network: nodes live in 10.20.4.0/24 inside the shared company VPC (10.0.0.0/8,
# ~40 other teams). Security group "redis-cluster" allows inbound 6380 and 16380
# from 10.0.0.0/8 so any service in the VPC can reach the cluster.
# Certificates: every node cert is issued by the company-wide internal CA
# (the same CA that signs every service cert in the VPC), SAN = the node hostname.

port 0
tls-port 6380
tls-cert-file /etc/redis/tls/node.crt
tls-key-file  /etc/redis/tls/node.key
tls-ca-cert-file /etc/redis/tls/company-ca.pem
tls-auth-clients optional
tls-replication yes
tls-cluster no

bind 0.0.0.0
protected-mode no

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no

aclfile /etc/redis/users.acl
# users.acl:
#   user default off
#   user app on >******** ~app:* &app:* +@read +@write -@dangerous
#   user ops on >******** ~* &* +@all

maxmemory 12gb
maxmemory-policy allkeys-lfu
appendonly yes
appendfsync everysec
