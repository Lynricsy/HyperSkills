# Upstream provenance for this skill. Schema: docs/skill-standard.md section 7.
# `commit` is filled automatically by: uv run tools/check_upstream.py --pin postgres
skill: postgres
version: "2026.09.12"           # must equal SKILL.md metadata.version
upstreams:
  - id: postgresql-docs
    kind: docs
    url: https://www.postgresql.org/docs/18/
    license: PostgreSQL
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The final authority for every fact in this skill: ALTER TABLE lock levels and rewrite rules, the table-level lock conflict matrix, RLS semantics (USING versus WITH CHECK, permissive versus restrictive, FORCE and BYPASSRLS, security_invoker views), isolation levels and serialization failures, MVCC, autovacuum and wraparound, index access methods and operator classes, JSONB operators, text search configuration, MERGE, NULLS NOT DISTINCT, generated columns, identity columns, and the PostgreSQL 18 deltas (buffers by default in EXPLAIN ANALYZE, not-null constraints as catalogue objects, B-tree skip scan, uuidv7, VIRTUAL generated columns, autovacuum_vacuum_max_threshold)."
    notes: "Licence verified by reading postgres/postgres COPYRIGHT: the PostgreSQL License, a permissive BSD-style licence, so this is merged rather than reference. Version currency verified against postgresql.org/support/versioning: 18 is the current major (18.6), 19 is in beta and is deliberately not covered."
  - id: neon-postgres-skills
    kind: repo
    repo: neondatabase/postgres-skills
    url: https://github.com/neondatabase/postgres-skills
    paths: [skills/postgres-best-practices]
    ref: main
    commit: 27fe45e0f71ea89a6eaf9ea4d2e4068957c81c26
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The vendor-neutral backbone: the reference split by topic, the convention of tagging every version-sensitive rule, PgBouncer pool modes and what each breaks, pool sizing against database CPU count, protocol-level prepared statements with max_prepared_statements, the pg_stat_* diagnostic catalogue including pg_stat_io and the PG 18 vacuum-timing columns, per-table autovacuum tuning, the correlated foreign-key-without-index detection query, the partitioned-table concurrent index build via ON ONLY plus ATTACH PARTITION, isolation levels and the application-side retry contract, and bulk loading."
    notes: "Deliberately vendor-neutral upstream maintained by Neon alongside their product skill; no Neon platform content needed stripping. Its default autovacuum scale factors (0.01/0.005) were preferred over supabase-postgres-bp's (0.05/0.02) as a starting point for hot tables; the actual PG 18 defaults were read from pg_settings instead of either."
  - id: supabase-postgres-bp
    kind: repo
    repo: supabase/agent-skills
    url: https://github.com/supabase/agent-skills
    paths: [skills/supabase-postgres-best-practices]
    ref: main
    commit: 8331f910845103c08d51f6ca1d86ebb7d1f745e3
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The eight-category rule taxonomy that shaped this skill's chapters, plus composite, partial and covering index rules, missing-index and unused-index detection, the unindexed foreign key, N+1 collapsed into = ANY(...), batched inserts, keyset pagination with a row-comparison cursor, FOR UPDATE SKIP LOCKED queues, advisory lock variants, deadlock avoidance by deterministic lock ordering, short transactions, the RLS scalar-subquery performance wrap, the private-schema SECURITY DEFINER helper pattern, and the DO-block workaround for the missing ADD CONSTRAINT IF NOT EXISTS."
    notes: "Supabase platform context stripped throughout: auth.uid() replaced by a session GUC, the anon/authenticated/service_role role names by app_user, the 5432/6543 port split by the abstract session/transaction pool-mode distinction, and the per-rule frontmatter fields (impact, impactDescription, tags) removed. Its unconditional '100x+ faster' claim for wrapping a policy function in a scalar subquery was narrowed to the Filter-node case after measurement (research/postgres.md ruling 4)."
  - id: microsoft-postgres-skills
    kind: repo
    repo: microsoft/postgres-skills
    url: https://github.com/microsoft/postgres-skills
    paths:
      - plugin/skills/postgresql-best-practices/references/postgresql-query-performance.md
      - plugin/skills/postgresql-best-practices/references/postgresql-advanced-indexing.md
      - plugin/skills/postgresql-best-practices/references/postgresql-connection-management.md
      - plugin/skills/postgresql-best-practices/references/postgresql-row-level-security.md
      - plugin/skills/postgresql-best-practices/references/postgresql-jsonb-patterns.md
      - plugin/skills/postgresql-best-practices/references/postgresql-vector-search.md
    ref: main
    commit: 500708a3de7cd8796da92460923b50fada93194b
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The gotcha-only corrections that the other upstreams get wrong or omit: node timings are per loop, INCLUDE columns do not eliminate heap access, BRIN needs verified physical correlation, text index and query collation must agree, a partial index is used only when its predicate is provably implied, hash_mem_multiplier, plan_cache_mode for parameter skew, JIT cost gating, per-backend memory at scale, server_reset_query state leakage, the complete RLS failure-mode set, missing-key versus JSON-null disambiguation, jsonb_set's intermediate-path limit, and the pgvector operator-class pairing and recall parameters."
    notes: "Only the six vendor-neutral postgresql-* references were used. The azure-* references, the pg-graph sibling skill, the postgres_mcp_* tool contract and the az CLI execution policy in its SKILL.md are managed-service control plane and MCP agent binding, both outside this skill's scope."
  - id: timescale-pg-aiguide
    kind: repo
    repo: timescale/pg-aiguide
    url: https://github.com/timescale/pg-aiguide
    paths:
      - skills/postgres-database-migration
      - skills/design-postgres-tables
    ref: main
    commit: 2bf9f11df6175d555e9a7f63325b226dca71c1b7
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The structure of the online-migration reference (lock and rewrite matrix, then a safe rewrite per operation, then backfills, then rollback and rehearsal), the two lock_timeout doctrines and the argument for doing retries in the deploy tool rather than a PL/pgSQL EXCEPTION block, LOCK TABLE ... NOWAIT as the zero-queue variant, CREATE UNIQUE INDEX CONCURRENTLY promoted with ADD CONSTRAINT ... USING INDEX, the do-not-use type list, TOAST storage strategies and toast_tuple_target, and fillfactor for HOT updates."
    notes: "Three of its facts were wrong against PostgreSQL 18.6 and were rewritten from measurement (research/postgres.md rulings 1-3): DEFAULT now() does not rewrite the table because now() is STABLE; the PG 18 unvalidated not-null syntax is ADD CONSTRAINT <name> NOT NULL <column> NOT VALID, not SET NOT NULL NOT VALID; and ADD CONSTRAINT ... CHECK ... NOT VALID takes ACCESS EXCLUSIVE, not SHARE UPDATE EXCLUSIVE. Its claim that partitioned tables cannot have outgoing foreign keys is also stale. TimescaleDB, hypertable and PostGIS content is out of scope and was not used."
  - id: pgvector
    kind: repo
    repo: pgvector/pgvector
    url: https://github.com/pgvector/pgvector
    paths: [README.md]
    ref: master
    commit: efa08fda9ec485d80292d0487a77939c087dedcc
    license: PostgreSQL
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Distance operator to operator-class pairing and the silent index-ignored failure when they disagree, HNSW build parameters and their immutability, hnsw.ef_search as the recall knob, iterative scan for filtered searches, the 2000-dimension HNSW ceiling and the halfvec expression-index workaround, and HNSW over IVFFlat for new deployments."
    notes: "The GitHub API reports license.spdx_id as NOASSERTION; the LICENSE file was read and is the PostgreSQL License (permissive, BSD-style), so this is merged. Behaviour verified against pgvector 0.8.6 on PostgreSQL 18.6."
  - id: awesome-copilot-pg
