    notes: "The ${selection} harness variable and the emoji section headings were stripped as required by docs/skill-standard.md section 1.3. Several of its worked examples were rejected rather than merged: GIN on data->'status' for scalar equality, BIGSERIAL and SERIAL primary keys, CITEXT as the default for case-insensitive text, ENUM for evolving status columns, and the built-in geometric types."
  - id: neon-agent-skills
    kind: repo
