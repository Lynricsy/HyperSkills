    notes: "The GitHub API reports license.spdx_id as NOASSERTION; the LICENSE file was read and is Apache-2.0 (Copyright 2026 Anton Babenko), which the README badge confirms, so this is merged. Two version claims were rejected against the Terraform CHANGELOG (research/terraform.md ruling 3): its feature-guard table dates the S3 native lock file to 1.10+ when `use_lockfile` reached general availability in Terraform 1.11 (OpenTofu 1.10), and it lists mock providers as 1.7+ without noting that OpenTofu did not gain them until 1.8. Its code-intelligence-lsp.md reference is a terraform-ls plus companion-plugin binding and was excluded as agent-specific per docs/skill-standard.md section 1.3, as was its five-part mandatory Response Contract; the review output contract in this skill is narrower. Its AWS/Azure/GCP backend, IAM policy and security-group examples are provider resource fields and were not used."
