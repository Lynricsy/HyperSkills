services:
  api:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@db:5432/app
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
