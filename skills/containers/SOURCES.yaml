  - id: kubernetes-docs
    kind: docs
    url: https://kubernetes.io/docs/
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The authority for every Kubernetes fact here: the removed-API table and each version's structural changes, probe semantics and the kubelet's behaviour on failure, QoS classes and eviction order, OOMKill and CFS throttling, the Pod Security Standards field lists and the restricted profile's requirements, PodDisruptionBudget eviction semantics, topology spread, NetworkPolicy's additive allow-only model, Service and Ingress shape, Job and CronJob fields, and the exact stability release of every gated field (sidecar containers 1.33, in-place resize 1.35, user namespaces 1.36, pod-level resources beta 1.34, preStop sleep 1.34)."
    notes: "Source repository kubernetes/website, licence CC-BY-4.0 per the repository metadata. Attribution: portions of this skill are derived from the Kubernetes documentation by the Kubernetes Authors, used under CC-BY-4.0; no text is copied verbatim. Version gates were read from the feature-gate data files' own stages fields rather than from prose, and the removal table from content/en/docs/reference/using-api/deprecation-guide.md."
  - id: docker-docs
    kind: docs
    url: https://docs.docker.com/
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Build cache invalidation rules (which instructions hash file metadata, that mtime is excluded, that one miss invalidates the rest), cache and secret mount syntax and behaviour, build-arg handling and the provenance attestation, multi-platform builds and the automatic platform args, registry cache export, and the statement that the Compose top-level `version` property is obsolete."
    notes: "Licence verified by reading docker/docs LICENSE: Apache-2.0, so merged rather than reference. Docker has no official agent-skills repository (the full org repository list was checked), so the documentation is the primary vendor source for this skill."
