    notes: "Its `references/conditional/{eks,gke,aks,openshift}-patterns.md`, `gitops-controllers.md` and `observability-stacks.md` were deliberately not used - managed control planes, GitOps controllers and observability stacks are outside this skill's scope. Its writing conventions (全大写 ALWAYS/NEVER directives, a duplicated docs/ copy of every reference) were not adopted. Its recommendation of `kubectl apply --dry-run=server` is kept, but its `--dry-run=client` suggestion was corrected after measuring that the client dry run still requires a reachable API server."
