    synced_at: "2026-09-15"
    contributes: "The sharing contract and its defaults, read from the config types rather than from prose: `renameByDefault` is a plain bool defaulting to false (so a sliced card is indistinguishable from a whole one unless it is set), `failRequestsGreaterThanOne` is a `*bool` that time-slicing leaves unset (effective false) while MPS forces true when unset, the replica multiplier semantics of the advertised count, the statement that time-slicing provides no memory or fault isolation, MPS being experimental and unsupported on MIG devices, per-node rather than per-GPU sharing configuration, the MIG strategy names and the resource names each produces, `DEVICE_LIST_STRATEGY` values, `FAIL_ON_INIT_ERROR` defaulting to true, and the IMEX channel injection limits."
    notes: "Defaults were verified by reading the Go structs and the chart values, not the README: `api/config/v1/config.go` sets MPS's `FailRequestsGreaterThanOne` to true when nil ('preserve the historical MPS behavior'), and `disableResoureRenaming` was checked to confirm it clears only per-resource `Rename` fields and leaves `RenameByDefault` in effect, which is what makes the `nvidia.com/gpu.shared` advice valid. The chart's `migStrategy: null` was the evidence that the plugin's own default is `none` while the GPU Operator chart ships `single`."
