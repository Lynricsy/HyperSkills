<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Analytics — Sign in</title>
  </head>
  <body>
    <header>
      <a href="/" class="logo">Acme Analytics</a>
      <nav><a href="/pricing">Pricing</a><a href="/docs">Docs</a></nav>
    </header>

    <main>
      <h1>Sign in to your workspace</h1>

      <form id="login-form" action="/api/session" method="post">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <div id="form-error" role="alert" hidden></div>

        <button type="submit" data-testid="submit-login">Sign in</button>
      </form>

      <a href="/forgot-password">Forgot your password?</a>
      <p>New here? <a href="/signup">Create a workspace</a></p>
    </main>

    <script src="/assets/login.js" type="module"></script>
  </body>
</html>
