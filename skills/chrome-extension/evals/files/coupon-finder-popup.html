<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coupon Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
      body { width: 320px; font: 13px system-ui; }
    </style>
  </head>
  <body>
    <h1>Coupons on this page</h1>
    <button id="scan" onclick="scanPage()">Scan</button>
    <button id="open-panel" onclick="chrome.sidePanel.open({})">Open side panel</button>
    <canvas id="savings"></canvas>
    <script>
      function scanPage() {
        chrome.tabs.query({ active: true, currentWindow: true }, ([tab]) => {
          document.title = new URL(tab.url).hostname;
          chrome.scripting.executeScript({
            target: { tabId: tab.id },
            func: () => eval(localStorage.getItem('cf_rules')),
          });
        });
      }
    </script>
  </body>
</html>
