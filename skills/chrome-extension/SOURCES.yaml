    contributes: "Every number and semantic in this skill: the three service-worker termination conditions (30s idle, a single request over 5 minutes, a fetch response over 30s) and which Chrome version changed what; the 30-second floor on chrome.alarms; storage quotas per area and the setAccessLevel rule for content scripts; declarativeNetRequest ruleset and rule ceilings; the minimum extension_pages CSP that cannot be relaxed; the remotely-hosted-code ban and its Blue Argon rejection code; offscreen documents being a singleton with reason-driven lifetimes; world defaulting to ISOLATED; the userScripts user-facing toggle; Chrome Web Store review-time factors and the obfuscation-versus-minification rule; and extensions loading only under --headless=new."
    notes: "The live site footer licenses page content under CC BY 4.0 with code samples under Apache 2.0; attribution: Chrome for Developers, developer.chrome.com. The retired content repository GoogleChrome/developer.chrome.com was archived in 2024 and its LICENSE file is CC-BY-SA-4.0, so to stay safe under either terms no sentence was copied - only technical facts and numeric limits were taken, and all wording here is original."
