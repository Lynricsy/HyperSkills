    relation: merged
    synced_at: "2026-10-15"
    contributes: "The recipe-JSON reading trap in references/parallelism-and-topology.md: `hardware_profile.gpu_count` describes the hardware SKU rather than the GPUs a command uses, so demand is read from the command's parallel flags, `node_count` and every `worker_commands` entry; and multi-node command objects carry `head_command`/`worker_commands` with no flat `command`. This replaced an unsourced claim that `gpu_count` is a per-node count to multiply by `node_count`."
    notes: "Tracked separately from vllm-source because this file exists only on main (added 2026-10-06 in #57786, absent from v0.29.0 and v0.31.0), while vllm-source is pinned to a release tag. Both facts were checked against the live published JSON on recipes.vllm.ai on 2026-10-15 (Qwen/Qwen3.8-27B: profile `gpu_count` 8 with `--tensor-parallel-size 1`; Qwen/Qwen3.8-2.4T-A95B: `node_count` 2, `head_command`/`worker_commands`, no `command`). The rest of the file - the lookup workflow, `read_recipe.sh`, and the recipe-authoring steps - is vLLM-recipes tooling and was not taken."
