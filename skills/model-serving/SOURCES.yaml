    contributes: "The densest benchmarking methodology of any upstream reviewed: open versus closed loop and why a closed-loop client measures its own concurrency, the load generator becoming the bottleneck, the congestion-collapse knee, reporting median with interleaved repeats, the noise-floor pilot and minimum detectable effect, separating confidence intervals before attributing a difference, re-measuring finalists, warmup stripping and ISL/OSL reconciliation as a results-credibility audit, comparing configuration families on their own SLO frontiers rather than at one shared operating point, the prefill/decode proxy-rate balance, the inference-side data-parallel versus tensor-parallel criterion, KV-event-loss fallback to approximate routing, and the interconnect variables whose absence silently falls back to TCP or host staging."
    notes: "Several of these SKILL.md files carry an in-body SPDX header of CC-BY-4.0 while the repository LICENSE is Apache-2.0; the LICENSE and NOTICE files were read directly to settle it (Apache-2.0, with MIT test data from DeepSeek-V3.2 noted in NOTICE). Only judgement criteria were taken; the Dynamo-specific artefact pipelines, backlog ledgers and replay harness were left behind, and the router mode list was corrected against the upstream's own docs where it omitted `power-of-two`."
