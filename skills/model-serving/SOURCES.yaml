    commit: 98dff2a81d747d1dba01a47f939f48c3526d4206
    license: Apache-2.0
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Every CLI flag, default and metric name in this skill was read from this release rather than from prose: the `--ready-check-timeout-sec` argparse default of 0 against the function default of 600, `--num-warmups` defaulting to 0, `--percentile-metrics` resolving to `ttft,tpot,itl` for generative models when unset and the reporting code emitting only selected metrics, `--metric-percentiles` defaulting to 99, `--goodput` taking space-separated `KEY:VALUE` pairs because it is `nargs=\"+\"`, `--random-range-ratio` defaulting to 0, the `--random-prefix-len` and `prefix_repetition` parameters, the full `--dataset-name` choice list including `timed_trace`, `--no-oversample` and `--disable-shuffle`, the counter/gauge declarations behind `vllm:prefix_cache_queries`, `vllm:prefix_cache_hits`, `vllm:num_preemptions` and `vllm:num_requests_waiting`, `gpu_memory_utilization` defaulting to 0.92, chunked prefill and prefix caching resolving from the model's own capability flags, the `ValueError` raised when `max_num_batched_tokens < max_model_len` with chunked prefill off, and the PRIORITY-policy preemption victim selection."
    notes: "Pinned to the v0.29.0 tag, not main, because several of these defaults differ between the two - `--ready-check-timeout-sec` reversed across releases and `client_queue_time` exists only on main. The `_total` suffix on counter time series was reproduced locally against prometheus_client rather than assumed, which is what makes the PromQL guidance in references/kv-reuse-and-routing.md correct."
