    notes: "Upstream ships the same two skills four times (packages/opencode, plugins/claude, plugins/cursor, and generated copies); only the packages/opencode tree is tracked to avoid counting one source four ways. The repository was renamed from sveltejs/mcp. Upstream frontmatter is agent-specific prose ('MUST be used whenever…', 'should be executed within the svelte-file-editor agent') and was rewritten; no agent-binding fields were carried over."
