    contributes: "The Tunnel verification discipline in references/cloudflare-one.md, which the official material states less sharply: the quick-versus-named decision criteria (a URL that may change and needs no login versus a hostname that must survive restarts and serve webhooks); that a printed trycloudflare.com URL is not a working tunnel and at least one `Registered tunnel connection` log line must also appear; that 200, 301, 302, 304, 401 and 403 all count as evidence the local service is reachable, because an auth challenge means the server answered; that DNS for a freshly created trycloudflare.com hostname can take a minute or two and may never resolve behind a fake-IP proxy resolver, so DNS-over-HTTPS is the fallback check; and the instruction to pause and warn before exposing an admin panel, an unauthenticated write API or internal tooling to the public internet."
    notes: "MIT confirmed by reading the LICENSE file (Copyright 2026 xiaoyuboi). Its `scripts/tunnel_helper.py` and the state directory convention under `.cloudflare-tunnel/` were not adopted: a Python wrapper around two cloudflared commands is not worth the maintenance, and the skill's own guidance is to run cloudflared directly. Its `metadata.tags` frontmatter field was stripped per docs/skill-standard.md section 1.2, and its `~/.claude/skills/...` absolute install paths are harness-specific and were not carried over."
