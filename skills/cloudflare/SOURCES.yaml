    contributes: "The version gates, which no skill or documentation page states precisely: declarative Durable Object `exports` landed in wrangler 4.107.0 (CHANGELOG entry for PR #14382), which is where this skill's `(Wrangler 4.107+)` gate comes from, along with the same release's notes that local development reads SQLite storage settings from `exports` and that wrangler now suggests an `exports` entry rather than a legacy migrations block for an undeclared Durable Object class. The shipped config-schema.json supplied the exact `DurableObjectExport` shape used in references/do-lifecycle.md - the five `state` values and the required fields for each (`storage` for created and expecting-transfer, `renamed_to`, `transferred_to`, `transfer_from`) - and its own description stating that Durable Object exports are mutually exclusive with `migrations` at the config-validation boundary."
