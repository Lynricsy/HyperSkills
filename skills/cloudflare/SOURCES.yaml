    contributes: "The official-vendor backbone. From workers-best-practices: the anti-pattern-to-consequence pairing that this skill's Core rules are written in, the rule that a destructured `ctx` loses its receiver and throws `Illegal invocation`, module-scope mutable state as simultaneously a cross-request leak and an I/O-ownership error, floating promises versus `ctx.waitUntil()`, streaming instead of buffering against the isolate memory limit, bindings instead of the Cloudflare REST API, `passThroughOnException()` as fail-open concealment, `extends` rather than `implements` on platform classes, `env` parameter versus `this.env` binding access, the per-API serialization boundary table, Web Crypto for tokens and constant-time secret comparison, and the standing instruction to prefer retrieval over pre-training with `wrangler --help` and the installed config-schema.json as the project's truth. From wrangler: non-inheritable keys must be restated per environment, dashboard edits are overwritten by deploy, omitted resource ids trigger automatic provisioning, `secret put` creates a version and deploys it immediately, a rollback does not roll back connected resources, and `CLOUDFLARE_ENV` selects the environment at dev/build time under the Vite plugin. From durable-objects: model one object per coordination atom rather than one global object, `getByName()` for deterministic routing, `blockConcurrencyWhile()` for constructor-time setup only and never across external I/O, persist before caching in memory, one alarm per object with `setAlarm()` replacing any pending one, and the use-versus-do-not-use table. From cloudflare-one: Access authorises applications while Gateway inspects traffic, Access is default-deny, the enrollment rule is a `warp`-type Access application so enrollment is debugged in Access, service-token clients authenticate as non_identity@ and never match IdP-group-targeted profiles, the split-tunnel include/exclude selection table and its per-profile scope, split-tunnel entries must align bidirectionally with tunnel routes, MDM parameters override dashboard profile settings, `dns.domains` matches subdomains while `dns.fqdn` is exact, HTTP Do Not Inspect precedes Allow/Block/Isolate, DLP profiles are inert until referenced by a policy, generated IPsec PSKs are returned once, and the log-toward-configuration troubleshooting direction. From the skills/cloudflare product reference tree: the gotchas for KV, R2, D1, Queues, Durable Object storage, static assets, Tunnel, Tail Workers, Miniflare and bindings, used to confirm this skill's coverage had no gaps."
    notes: "Apache-2.0 confirmed by reading the LICENSE file rather than trusting the API's spdx_id. Its frontmatter carries only `name` and `description`, so no agent-specific fields needed stripping. Three of its facts were rejected against the official documentation (research/cloudflare.md rulings 1, 3 and 5): runtime-patterns.md states CPU limits as `10ms (Bundled) or 30s (Standard/Unbound)`, which are retired usage-model names - the current figures are 10 ms fixed on Free and a 30 s default with a 300,000 ms ceiling on Paid; durable-objects/SKILL.md teaches the legacy `migrations` array with `new_sqlite_classes` as the way to declare class lifecycle, superseded by the declarative `exports` map; and its testing reference points at `@cloudflare/vitest-pool-workers`, which has been replaced by `@cloudflare/vitest-plugin`. Its skills/agents-sdk (18 references, high quality) and skills/nextjs-on-cloudflare were excluded as out of scope per this batch's cross-skill contract; the Agents SDK and MCP topics have no skill in this library yet. The Stream, Zaraz, RealtimeKit, Spectrum, Turnstile, WAF and Bot Management branches of the product tree are network and security product surface and were not used. Its references/workers.md CORS, Zod-validation and timeout-wrapper snippets were not copied - they are general knowledge the model already has."
  - id: cloudflare-docs
    kind: docs
    url: https://developers.cloudflare.com/
    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The authority behind every number, default and version gate in this skill, and the source for everything the upstream skills get wrong or omit: the Workers plan-limit and CPU/wall-time tables including the `limits.cpu_ms` 30,000 default and 300,000 ceiling and the 30-second `waitUntil` extension; the 128 MB per-isolate memory limit and the six-connections-awaiting-headers rule; the compatibility-date mechanism and the 2021-11-02 default for API uploads; the secrets surface (`secret put` versus `versions secret put`, `.dev.vars` versus `.env` precedence, `secrets.required`, `--secrets-file`); environments deploying a separate `<name>-<env>` Worker with non-inheritable bindings and environment-suffixed service bindings; the declarative Durable Object `exports` lifecycle in full - every `state` and its required fields, the three-deploy rename, the four-deploy transfer, storage-backend immutability and `storage_type_mismatch`, reconciliation output, and the constraint set (mutually exclusive with `migrations`, one-way, no `versions upload`, no gradual deployments, rollbacks cannot cross a lifecycle change); Durable Object limits and the ~1,000 req/s soft limit, `overloaded`, and `SQLITE_FULL`; WebSocket hibernation and its billing consequence; the KV consistency model (immediate locally, up to 60 seconds or more elsewhere, negative lookups cached, 1 write per second to the same key, 60-second `cacheTtl` default) and the write-through-a-Durable-Object pattern; D1's 10 GB unraisable ceiling, single-threaded execution, and the Sessions API with bookmarks for read replication; R2's object and upload sizes and its 1-write-per-second-per-key rule; the Queues limit and default set including the discard behaviour with no dead-letter queue; static assets - `assets.directory`, `run_worker_first`, `not_found_handling`, `.assetsignore`, default response headers, the `_headers`/`_redirects` grammar and limits, and the rule that neither applies to Worker-generated responses; the Pages-to-Workers migration sequence and `wrangler pages functions build`; versions, gradual deployments, version affinity and the four rollback constraints; Workers Logs and traces configuration, invocation outcomes, Tail Workers, the OTel export and the `workers_trace_events` Logpush dataset; and the testing surface - `@cloudflare/vitest-plugin` with `cloudflareTest()`, `cloudflare:test` helpers including `runInDurableObject`, `runDurableObjectAlarm` and `evictDurableObject`, per-file storage isolation, and the automatically injected `nodejs_compat` trap."
    notes: "Licence established by reading the LICENSE file of the documentation source repository cloudflare/cloudflare-docs: its text is the Creative Commons Attribution 4.0 International licence, matching the API's spdx_id. CC-BY-4.0 permits merging under docs/roadmap.md's licence table, so attribution is required and is carried here and in NOTICE.md: content adapted from the Cloudflare Developer Documentation (c) Cloudflare, Inc., CC-BY-4.0. This is deliberately unlike batch 5, where redis.io (CC-BY-NC-SA-4.0), the Elastic docs (CC-BY-ND) and hashicorp/terraform (BUSL-1.1) could only be reference - a repository's licence is its own, and this one was read rather than assumed. Everything taken from here was rewritten; no passage is reproduced verbatim."
