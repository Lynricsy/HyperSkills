    synced_at: "2026-09-11"
    contributes: "Headless and CI discipline: always pass --headless --path <project> so the run does not depend on the working directory, capture output to a log file because the interesting failures are on stderr, override XDG_DATA_HOME / XDG_CONFIG_HOME / XDG_CACHE_HOME to a project-local directory in sandboxes and containers where user:// writes fail, never edit .tscn as raw text but drive edits through --headless --script, and keep the boot smoke test separate from logic tests."
    notes: "Licence read in full: MIT. Pushed 2026-04-26, which is inside the six-month window but scores 1 on freshness; every rule taken from it was independently reproduced on this machine before being written down."
