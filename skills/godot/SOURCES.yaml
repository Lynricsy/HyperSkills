    ref: "4.7"
    commit: ed1daf0bf001b61586d9930840f2f1394092c079
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "First-class fact source, the machine-checkable form of the class reference. doc/classes/*.xml supplied every property default (mouse_filter STOP on Control but IGNORE on Label and PASS on TextureRect; collision_layer and collision_mask both 1; inference_on_variant at Error; rendering_method forward_plus with .web defaulting to gl_compatibility), every deprecated= marker (TileMap, ParallaxBackground), and the exact semantics of queue_free, _ready, add_child(force_readable_name) and set_multiplayer_authority(recursive). Engine source supplied three facts that exist in no prose: RPC dispatch is by the sorted position of the method name (scene_rpc_interface.cpp), the rpc checksum only prints and continues (scene_cache_interface.cpp:119), and new projects are written four non-default settings by EditorNode::get_initial_settings (editor_node.cpp:8346)."
    notes: "Licence read in full: LICENSE.txt is the Expat MIT licence, so merged. Pinned to the 4.7.2-stable commit on the 4.7 release branch, not master: the release branch and master have diverged (151 ahead, 2241 behind), so pinning master would track facts that are not in any shipped 4.7. Every version gate in this skill was forensically established by fetching the same doc/classes file from the 4.2, 4.3, 4.4, 4.5, 4.6 and 4.7 branches and finding the branch on which the member, annotation or deprecated= attribute first appears, rather than by trusting prose; misc/extension_api_validation/<from>-stable/GH-*.txt is the engine's own pre-diffed extension-API break ledger and was used to confirm signature changes. Declarations and source win over prose whenever they disagree: four upstream or documentation claims were overturned this way - duplicate signal connect, the @rpc checksum mechanism, assigning the anchors_preset property, and the ParallaxBackground deprecation version."
  - id: godot-docs
    kind: repo
    repo: godotengine/godot-docs
    url: https://github.com/godotengine/godot-docs
    paths:
      - tutorials/rendering
      - tutorials/migrating
      - tutorials/export
      - tutorials/scripting
      - tutorials/ui
      - tutorials/physics
      - tutorials/networking
      - tutorials/performance
      - tutorials/best_practices
    ref: master
    commit: e1129cb5c3f27e0e3a12e816ae405ab5ce032e3f
    license: CC-BY-3.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The Forward+ / Mobile / Compatibility feature matrix that drives renderer selection, including the counter-intuitive entries (web supports Compatibility only; SSAO works on Compatibility but not Mobile; CompositorEffects need a RenderingDevice renderer; only Forward+ has volumetric fog, SSR, SDFGI, VoxelGI, TAA and FSR2). The seven upgrading_to_godot_4.x guides supplied every version gate used in this skill, including the Godot 4.7 behaviour changes (AudioStreamPlayer.area_mask default 1 to 0, Jolt WorldBoundaryShape3D plane sign, mouse and keyboard device ids, CanvasItem line feather) and the Godot 4.6 .tscn format change."
    notes: "GitHub reports NOASSERTION; LICENSE.txt read in full and it is Creative Commons Attribution 3.0 Unported, with no NonCommercial and no NoDerivatives clause, so merged with attribution. Attribution: Juan Linietsky, Ariel Manzur and the Godot community, CC-BY-3.0. Tracked as a repo rather than as kind: docs so that commits can be pinned and changes detected per path; docs.godotengine.org is this repository's build output. One correction was applied against the declarations: upgrading_to_godot_4.7.rst attributes the area_mask default change to AudioStreamPlayer, but the property exists only on AudioStreamPlayer2D and AudioStreamPlayer3D, where the branch diff shows default 1 on 4.6 and 0 on 4.7; the plain AudioStreamPlayer has no area_mask at all."
  - id: awesome-gamedev-godot
    kind: repo
    repo: gamedev-skills/awesome-gamedev-agent-skills
    url: https://github.com/gamedev-skills/awesome-gamedev-agent-skills
    paths:
      - skills/godot
    ref: main
    commit: b105e1cf617adf0b68ed98790a716bbb60993179
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Backbone: the topic split that this skill's references follow, and the pitfalls-before-API shape. Concrete rules carried over include change_scene_to_file being deferred so the new scene's nodes are unreachable on the calling line, scene-unique %Name surviving renames where $Path does not, PhysicsRayQueryParameters exclude taking Array[RID] rather than nodes, force_raycast_update() after moving a ray within a tick, call_group silently skipping nodes that lack the method, RigidBody position assignment fighting the solver, and the Control rect_* to size/position/custom_minimum_size rename."
    notes: "Licence read in full: root LICENSE is Apache-2.0 and it is the only licence file in the tree, so no per-directory check was needed. Three claims were overturned against the engine and are stated the other way round in this skill: duplicate connect of the same Callable is rejected rather than stacked, the @rpc mismatch mechanism is id shifting rather than annotation checksumming, and assigning anchors_preset is a no-op. The Related skills sections cross-reference sibling skills that do not exist in this library (physics-tuning, save-systems, game-ai, steam-publish, card-game) and were removed per the frontmatter and cross-reference rules; the animation, audio, tilemap, shader and 3D-scene skills in the same directory were used only to confirm coverage boundaries."
  - id: haxqer-godot
    kind: repo
    repo: haxqer/godot-skill
    url: https://github.com/haxqer/godot-skill
    paths:
      - skill/godot
    ref: main
    commit: 8e0552b158861020d6a9a12059ce11c4ba8cd303
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The only community upstream that states checkable Godot 4.7 assertions rather than restating tutorials. Supplied the := inference rule (inference_on_variant ships as an error, so inferring from a Dictionary read or an untyped call does not load at all), the hand-written .tscn trap where every node carrying parent=\".\" loads with zero errors and stacks every Control at the origin, the TileMap to TileMapLayer and ParallaxBackground to Parallax2D node deprecations, the container-first layout doctrine as the fix for controls piling up at the origin, and that POT generation and lightmap, occluder and reflection-probe bakes are editor-only and cannot be driven headlessly."
    notes: "Licence read in full: MIT. Assertions were spot-checked against the engine and two of three held exactly: inference_on_variant is default=2 in ProjectSettings.xml and is a parse error on this machine, and the .tscn parent=\".\" trap reproduces. The third was corrected by a cross-branch diff of doc/classes: upstream calls both node replacements 4.3 deprecations, but the deprecated= attribute on TileMap.xml first appears on branch 4.3 while the one on ParallaxBackground.xml first appears on branch 4.5 - Parallax2D was merely added in 4.3. This skill therefore states the two gates separately. The upstream is built around its own bundled dispatcher.gd and run_project.py toolchain, which was not copied; only the engine facts and the headless conventions were taken."
