    url: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices
    license: NONE
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Core authoring principles, the three degrees of freedom, the three progressive-disclosure patterns and the partial-read reason for one-level references, workflow checklists and validation loops, template / examples / conditional-workflow patterns, evaluation-driven development and the evals.json shape, the two-agent iteration loop and the four navigation signals, script rules (solve rather than defer, no voodoo constants, explicit dependencies), the anti-pattern list, and the pre-release checklist."
