    license: Apache-2.0
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Description triggering strategy for capability skills, the 20-query trigger set with near-miss negatives and the 60/40 held-out split, the baseline-and-with-skill evaluation loop, grading and benchmark field names, organising references by variant, the transcript signal that justifies bundling a script, and the lack-of-surprise safety rule."
    notes: "Licence is per skill directory, not per repository: skills/skill-creator/LICENSE.txt read on 2026-09-10 is Apache-2.0, unlike the proprietary docx/pptx/xlsx/pdf skills in the same repo. Re-check that file on every sync; if it becomes proprietary this entry must drop to relation: reference. None of the Claude-specific machinery (subagent graders, CLI description optimiser, HTML eval viewer) was ported."
  - id: anthropic-best-practices
