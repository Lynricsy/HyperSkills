    notes: "Vendor documentation with no licence grant; included under fair-use with attribution per project policy. Every field is labelled non-standard in the reference file. The 2026-10-15 whole-listing budget correction was read from the skills page's 'Skill descriptions are cut short' section, the settings reference entries for skillListingBudgetFraction (default 0.01) and skillListingMaxDescChars (default 1536), and the environment-variable reference for SLASH_COMMAND_TOOL_CHAR_BUDGET (8,000-character fallback)."
