    commit: bb92a77741419a4ab5f06e711a283343f1ada0c3
    license: MIT
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Baseline-first discipline for authoring, the rule that a workflow skill's description carries triggering conditions only, load-frequency token budgets, verb-first naming, the ban on path syntaxes that force-load a file, the match-the-form-to-the-failure table with its head-to-head wording evidence, rationalisation tables and red-flag lists, micro-testing wording against a no-guidance control, and (v6.4.1) invoking bundled scripts through their interpreter rather than by bare path, because some packagers strip the executable bit."
    notes: "Two defects corrected on merge: its own frontmatter example shows a capitalised hyphenated name, which the specification forbids, and its cross-references use a plugin namespace prefix plus relative links into sibling skills, which break when a skill is installed alone. Graphviz diagrams dropped. The interpreter rule corrects this skill's earlier claim that a bare relative script path works everywhere; the stripped-bit failure was reproduced locally with Python's zipfile extractor (mode 0700 archived, 0600 extracted, bare call Permission denied, bash call succeeds)."
  - id: agentskills-spec
    kind: docs
    url: https://agentskills.io/specification
    license: Apache-2.0
    relation: merged
    synced_at: "2026-10-15"
