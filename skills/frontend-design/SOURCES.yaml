    notes: "Everything taken was rewritten as decidable statements and stripped of its landing-page framing. Not used: the 87 KB body's prose, the GSAP sticky-stack and horizontal-pan skeletons, the Tailwind and Motion stack chapter, the self-referential block-library contract, Appendix A install commands and Appendix C's Liquid Glass CSS. Its section 2 design-system map (brief to Polaris, Fluent, Carbon, GOV.UK) was dropped after the 2026-09-15 baseline: scenario 9 showed the model already picks Polaris for a Shopify admin surface and states the one-system rule unprompted. Its prefers-reduced-transparency fallback advice was not carried over as written: that query is Baseline limited (Chromium only), so the opaque variant is the default and the glass effect is the enhancement."
