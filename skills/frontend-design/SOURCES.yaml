    commit: f624f37a8c650b9cc550253104925efe4c8de246
    license: MIT
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Origin of the VARIANCE / MOTION / DENSITY dial system and the one-line design read. From the v2 body: the countable section budgets (eyebrow labels within ceil(sections/3), one layout family reused at most once, at most two consecutive image-and-text splits, one marquee, grid cells equal to items, four text elements in a hero), hero measure and top-padding ceilings, single-line desktop navigation, bento background diversity, the split-header rejection, page theme lock, the component-not-a-longer-list rule for more than five items, and the production-test tells (logo-wall category labels, generic step labels, micro-meta sentences, performative-craftsman and coy social-proof labels, hero status stamps, live-scarcity counters, image-overlay pills, decorative photo credits, filled-track comparison bars, rotated text, decorative hairline grids)."
    notes: "Everything taken was rewritten as decidable statements and stripped of its landing-page framing. Not used: the 87 KB body's prose, the GSAP sticky-stack and horizontal-pan skeletons, the Tailwind and Motion stack chapter, the self-referential block-library contract, Appendix A install commands and Appendix C's Liquid Glass CSS. Its section 2 design-system map (brief to Polaris, Fluent, Carbon, GOV.UK) was dropped after the 2026-09-15 baseline: scenario 9 showed the model already picks Polaris for a Shopify admin surface and states the one-system rule unprompted. Its prefers-reduced-transparency fallback advice was not carried over as written: that query is Baseline limited (Chromium only), so the opaque variant is the default and the glass effect is the enhancement. At the 2026-10-15 sync (ca50fb4, d1a1405, 9da1763) upstream moved that single-file dial-driven body, unchanged apart from a StickyStack id fix, to skills/taste-skill-v2-experimental, so the path is tracked there too, and replaced skills/taste-skill with a new library-driven default (a 247-site study, JSON corpora of directions, palettes, type and photos, CDP inspection and lint scripts, and a rule to source real photographs and footage from open collections through scripts/assets.mjs). That default was reviewed and not merged (see research/frontend-design.md); it stays tracked so later changes are seen."
