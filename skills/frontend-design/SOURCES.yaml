    notes: "React and Framer Motion specific items (useSpring, initial={false}, non-accelerated shorthands) were left to the react skill. Its 2026-10 animation-performance skill was reviewed and not carried: the baseline model already fixed margin and box-shadow animation, discounted desktop CPU throttling and handled the SMIL traps (research/frontend-design.md, 2026-10-15 new-content review); its claim that filter: drop-shadow() is the cheap substitute for box-shadow is contradicted by Chromium, which declines to composite filter animations that move pixels."
