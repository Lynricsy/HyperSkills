# ~/.gitconfig on the machine this repository is worked on
[user]
	name = Sam Okafor
	email = sam@example.com
	signingkey = ~/.ssh/id_ed25519_signing.pub

[init]
	defaultBranch = main

[core]
	editor = vim
	autocrlf = false
	hooksPath = ~/.config/git/hooks

[gpg]
	format = ssh

[commit]
	gpgsign = true

[merge]
	conflictstyle = merge
	ff = false

[rerere]
	enabled = true
	autoupdate = true

[pull]
	rebase = false

[push]
	default = current
	autoSetupRemote = true

[rebase]
	autoStash = true

[alias]
	fp = push --force
	nuke = !git reset --hard && git clean -fdx
	sync = !git fetch origin && git reset --hard origin/main
	unwip = reset --soft HEAD~1
	lg = log --graph --oneline --decorate --all
