skill: security-review
version: "2026.09.11"
upstreams:
  - id: cloudflare-audit
    kind: repo
    repo: cloudflare/security-audit-skill
    url: https://github.com/cloudflare/security-audit-skill/tree/main/skills/security-audit
    paths: [skills/security-audit]
    ref: main
    commit: d24bc269171a9171fac58493e0ffba511d571a4a
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The audit method and its evidence contract: a coverage ledger whose unreached units must be named rather than silently dropped, the invariant-first trace (lower-trust principal, accepted value, the control that should have rejected it, the path after that decision, the smallest observable effect), the rule that whoever validates a candidate must not be whoever found it, the confirmed / needs-validation / rejected three-state disposition with rejected records retained, likelihood and impact reported separately with overall severity capped at demonstrated impact, and the position that a clean pass may legitimately have zero findings."
    notes: "Its multi-agent dispatch protocol and the artifact-promotion procedure were deliberately left out: they target an orchestrator with an OS-enforced sandbox, whereas this skill is written for one agent doing one audit."

  - id: sentry-secreview
    kind: repo
    repo: getsentry/skills
    url: https://github.com/getsentry/skills/tree/main/skills/security-review
    paths: [skills/security-review]
    ref: main
    commit: c2f99a5b04b4cd992ec3022d7c2c3e23e938d241
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The other half of false-positive governance: the attacker-controlled versus server-controlled input taxonomy (settings, environment variables, deployment config and constants are not attacker input), the framework-mitigated pattern list with the narrow conditions that do make each one a finding, the four check-the-context-first classes, and the confidence gate that keeps theoretical defence-in-depth observations out of the report."
    notes: "The repository root is Apache-2.0 but skills/security-review/LICENSE declares that directory's reference material derived from the OWASP Cheat Sheet Series under CC-BY-SA-4.0, so the stricter directory licence governs. Share-alike is incompatible with this repository's MIT licensing: no prose, table or code block was copied, only the checklist semantics, and every sentence here was written from scratch."

  - id: openai-threatmodel
    kind: repo
    repo: openai/skills
    url: https://github.com/openai/skills/tree/main/skills/.curated/security-threat-model
    paths: [skills/.curated/security-threat-model]
    ref: main
    commit: 49f948faa9258a0c61caceaf225e179651397431
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Repository-grounded threat modelling: trust boundaries written as concrete edges annotated with protocol, authentication, encryption, validation and rate limiting; asset and entry-point inventory; attacker capabilities stated together with explicit non-capabilities so severity is not inflated by an unstated worst case; qualitative likelihood times impact with the assumption that most drives the ranking named out loud."
    notes: "The repository has no root licence file (GitHub reports license: null), but skills/.curated/security-threat-model/LICENSE.txt is the full Apache-2.0 text, which governs this directory. Its step that pauses to have the user confirm assumptions before producing the report was reworked into stating the assumptions and marking conclusions conditional on them, because a single-turn audit that pauses produces nothing."

  - id: openai-secbase
    kind: repo
    repo: openai/skills
    url: https://github.com/openai/skills/tree/main/skills/.curated/security-best-practices
    paths: [skills/.curated/security-best-practices]
    ref: main
    commit: 49f948faa9258a0c61caceaf225e179651397431
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Cross-language invariants for the injection, authentication, authorization and secrets sections, and the fact-checking pass over them."
    notes: "Directory LICENSE.txt is the full Apache-2.0 text. Its per-language guides were not carried over: this repository already has python, typescript, go, java-spring, csharp-dotnet, laravel, nodejs-backend and fastapi skills that own language-specific correctness."

  - id: openai-ownership
    kind: repo
    repo: openai/skills
    url: https://github.com/openai/skills/tree/main/skills/.curated/security-ownership-map
    paths: [skills/.curated/security-ownership-map]
    ref: main
    commit: 49f948faa9258a0c61caceaf225e179651397431
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "One idea for the scoping phase: rank what to audit first by the ownership and bus factor of the sensitive paths, so an unowned security-critical module is reviewed before a well-staffed one."
    notes: "Directory LICENSE.txt is the full Apache-2.0 text. Its scripts, graph exports and Neo4j workflow were not carried over — they are a separate tool, not part of an audit pass."

  - id: tob-semgrep-rules
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/semgrep-rule-creator
    paths: [plugins/semgrep-rule-creator]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The shape of the rule-writing workflow: write the annotated test file before the rule, prefer taint mode over syntactic patterns when the bug is a data flow, one rule per YAML file, and no todoruleid / todook escape hatches that defer a known gap."
    notes: "CC-BY-SA-4.0 is share-alike and incompatible with this repository's MIT licensing, so no prose, rule or test file was copied — only the checklist semantics, rewritten. Every command, exit code and severity claim in references/semgrep-rules.md was re-measured locally against semgrep 1.177.0 rather than taken from the upstream text."

  - id: tob-brocards
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/vulnerability-triage-brocards
    paths: [plugins/vulnerability-triage-brocards]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The idea that false-positive control is a set of falsifiable dismissal tests rather than an exhortation to be careful, and the semantics of those tests: no finding without a threat model, no attacker capability that already exceeds the impact, nothing outside real usage, nothing that is correct implementation of a specification, nothing already documented with its security implications, nothing whose remediation costs more than the bug, and a CVE identifier proving neither presence nor absence."
    notes: "Share-alike; semantics only, all wording original. The upstream's audit-engagement and bug-bounty framing was dropped as irrelevant to a repository audit."

  - id: tob-insecure-defaults
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/insecure-defaults
    paths: [plugins/insecure-defaults]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The six-way classification used when auditing configuration: debug features left on, default credentials, fail-open error handling, fallback secrets, permissive access, and weak cryptography selected by default."
    notes: "Share-alike; only the classification was taken. Its references/*.json fact datasets were not copied in any form."

  - id: tob-supplychain
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/supply-chain-risk-auditor
    paths: [plugins/supply-chain-risk-auditor]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Widening dependency review from 'does it have a CVE' to 'is this dependency itself a risk': maintenance state, release cadence, ownership changes and install-time code as first-class signals."
    notes: "Share-alike; semantics only. Its collect / model / render scripts were not copied."

  - id: tob-diffreview
    kind: repo
    repo: trailofbits/skills
    url: https://github.com/trailofbits/skills/tree/main/plugins/differential-review
    paths: [plugins/differential-review]
    ref: main
    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: reference
    synced_at: "2026-09-11"
    contributes: "Read to fix the boundary with the code-review skill, which already carries this material as its security-review-delta workflow. Confirmed that delta-shaped security review stays there and whole-surface auditing stays here; no content copied."

  - id: copilot-threatmodel
    kind: repo
    repo: github/awesome-copilot
    url: https://github.com/github/awesome-copilot/tree/main/skills/threat-model-analyst
    paths: [skills/threat-model-analyst]
    ref: main
    commit: 7568a482ce2df38f8965ab5336a3220db796a4ba
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The ordering that keeps a threat model from degenerating into a checklist — inventory assets and entry points, then draw the boundaries, then apply STRIDE to each boundary — and the practice of rebuilding a threat model incrementally when the architecture moves rather than from scratch."

  - id: copilot-secrets
    kind: repo
    repo: github/awesome-copilot
    url: https://github.com/github/awesome-copilot/tree/main/skills/secret-scanning
    paths: [skills/secret-scanning]
    ref: main
    commit: 7568a482ce2df38f8965ab5336a3220db796a4ba
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The leaked-credential ordering: revoke first, rotate second, deal with history last, because rewriting history invalidates nothing and every fork, mirror and clone keeps a working credential until it is revoked."
    notes: "Its GitHub product surface — configuring push protection, custom patterns, the alerts API — was left to the github skill by the boundary agreed for this batch."

  - id: copilot-secreview
    kind: repo
    repo: github/awesome-copilot
    url: https://github.com/github/awesome-copilot/tree/main/skills/security-review
    paths: [skills/security-review]
    ref: main
    commit: 7568a482ce2df38f8965ab5336a3220db796a4ba
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Phase ordering for a whole-repository pass: resolve scope and stack, take the dependency manifests and the secret sweep first because they are cheap and high-yield, then spend the remaining effort on data-flow reading."
    notes: "Its box-drawing and emoji report template was not adopted — it misaligns in terminals and diffs and spends tokens on decoration. Its OWASP citations use the 2021 numbering, which this skill corrects to 2025."

  - id: trilwu-audit
    kind: repo
    repo: trilwu/secskills
    url: https://github.com/trilwu/secskills/tree/main/secskills-core/skills/auditing-code-for-vulnerabilities
    paths: [secskills-core/skills/auditing-code-for-vulnerabilities]
    ref: main
    commit: ca53957bcd8e3b83b5d4d190bb3ad008a4f15c84
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The four-pass loop that separates auditing from scanning — build context, map the attack surface, hunt specific bug classes along the reachable paths, then prove exploitability before writing anything down — and the argument for why skipping straight to the hunt produces noise."

  - id: owasp-top10
    kind: docs
    url: https://github.com/OWASP/Top10/tree/master/2025/docs/en
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The authoritative category names and numbering for the 2025 edition, the 2021 numbering it replaced, and the CWE mappings — including the fact that CWE-918 (SSRF) now sits inside A01:2025 Broken Access Control instead of being its own category."
    notes: "The repository's LICENSE file was read directly and is the full CC BY-SA 4.0 text, despite the GitHub API reporting NOASSERTION. Category names and numbers are cited as facts; no descriptive prose was copied."

  - id: owasp-asvs
    kind: docs
    url: https://github.com/OWASP/ASVS/tree/master/5.0/en
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The ASVS 5.0.0 chapter set (V1 Encoding and Sanitization through V17 WebRTC) used as the coverage checklist for a whole-surface audit, and the renumbering against 4.0.x that makes an old chapter citation point at the wrong subject."
    notes: "LICENSE.md was read directly and is the full CC BY-SA 4.0 text. Chapter numbers and titles are cited as facts; no requirement text was copied."

  - id: semgrep-skills
    kind: repo
    repo: semgrep/skills
    url: https://github.com/semgrep/skills
    paths: [skills/code-security, skills/semgrep]
    ref: main
    commit: 68177b8830f96cd9d10dacbb14dde2566360503d
    license: Proprietary
    relation: reference
    synced_at: "2026-09-11"
    contributes: "Read to cross-check semgrep rule semantics against the vendor's own material. No content copied: the repository's LICENSE is a single line naming the Semgrep Rules License v1.0, a custom non-OSI licence, so this upstream is reference-only and permanently so. Every semgrep fact in this skill was measured locally instead."
