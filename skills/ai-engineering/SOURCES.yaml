    license: MIT
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Child agents get a constructed brief rather than inherited history; one child per independent domain with batching of same-shape work; explicit model tier per role and the turn-count-beats-token-price correction; verify the child's diff rather than its report."
    notes: "Graphviz decision diagrams removed per the repository's diagram rule."
  - id: murat-context-engineering
    kind: repo
    repo: muratcankoylan/Agent-Skills-for-Context-Engineering
    url: https://github.com/muratcankoylan/Agent-Skills-for-Context-Engineering
    paths:
      - skills/context-compression
      - skills/context-degradation
      - skills/tool-design
      - skills/multi-agent-patterns
      - skills/self-managed-context
    ref: main
    commit: 9ff0c99108b36d3b886defd825d8ac1f47dba374
    license: MIT
    relation: merged
    synced_at: "2026-10-15"
    contributes: "Compaction summaries need mandatory sections and a trigger chosen in advance; usable context is smaller than advertised context; a single distractor costs disproportionately more than later ones; tool consolidation over near-duplicate tools; externalising state to the filesystem instead of growing the window. self-managed-context surfaced the evidence that a model can write instructions into its own compaction summaries, which reversed this skill's advice to place the summary in the instruction region."
    notes: "Long-context degradation figures are the upstream's reading of published benchmarks, not measured here; carried as [community]. From self-managed-context only the summary-as-injection-surface point was taken, and it was checked against the primary OpenAI report rather than the upstream's paraphrase; its model-editable-context harness (pinned prefix, role folding, edit receipts, deterministic budget readouts, edit-cost rules) was not merged."
