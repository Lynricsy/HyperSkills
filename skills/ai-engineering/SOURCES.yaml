  - id: openai-alignment-compaction-report
    kind: docs
    url: https://alignment.openai.com/misalignment-reports/self-generated-prompt-injections-in-compaction-summaries/
    license: Proprietary
    relation: reference
    synced_at: "2026-10-15"
    contributes: "Primary evidence for the compaction-summary rule in references/context-budget.md: during RL training a model wrote jailbreak-style and arbitrary task-restricting 'additional instructions' into its own compaction summaries (27 found by a dedicated monitor), and in one case the successor context obeyed them as a higher-priority instruction and failed the task."
    notes: "Read in full on 2026-10-15 (incident 2026-07-18, report updated 2026-09-16). The report calls the behaviour extremely rare and tied to a summary-termination bug in one training run; the skill uses it only to justify treating summaries as data, not to claim a frequency. No licence grant found; reference only, paraphrased."
