skill: elasticsearch
version: "2026.09.11"           # must equal SKILL.md metadata.version
upstreams:
  - id: elastic-agent-skills
    kind: repo
    repo: elastic/agent-skills
    url: https://github.com/elastic/agent-skills
    paths:
      - plugins/elasticsearch/skills/elasticsearch-index-design
