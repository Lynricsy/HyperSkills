# .github/workflows/ci.yml (excerpt)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.11.0
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx nuxt build
