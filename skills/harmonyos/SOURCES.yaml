    license: CC-BY-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Primary fact source: the arkts-* language restriction set with severities and error codes, state management V1/V2 decorator semantics and constraints, the API-gated V1/V2 interop rules, UIAbility and WindowStage lifecycles, UIContext replacements for global ArkUI APIs, TaskPool/Worker comparison, module.json5 and permission declaration schema, Preferences/RelationalStore limits, hdc and uitest."
    notes: "Licence read in full: LICENSE is Creative Commons Attribution 4.0 International, no NonCommercial or NoDerivatives clause, so merged with attribution. This is the OpenHarmony documentation, not HarmonyOS NEXT's: platform contracts are shared and taken from here, while HarmonyOS-only facts (API version strings, DevEco Studio, AppGallery, Huawei Kits) come from huawei-docs and are marked [official]."

