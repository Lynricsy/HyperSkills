    relation: merged
    synced_at: "2026-09-11"
    contributes: "Machine-checkable API availability: the @since / @deprecated / @useinstead annotations on the public SDK declarations, which is what lets an API-version claim in this skill be [verified] rather than [official]. Established that every global router function carries @deprecated since 18 with @useinstead @ohos.arkui.UIContext:Router, that UIContext.getRouter and getPromptAction are @since 10 while UIContext.isAvailable is @since 20, and that AtManager.checkAccessToken is @since 9."
    notes: "Licence read in full: Apache License Version 2.0. This is the authoritative source for API shape and availability and it corrected the prose guide: ui/arkts-global-interface.md reads as though the UIContext replacements arrived at API 18, while the declarations show the accessors at API 10 and API 18 as the deprecation point for the global forms. When the two disagree, the declaration wins."
