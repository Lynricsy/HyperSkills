    license: MIT
    relation: merged
    synced_at: "2026-10-15"
    contributes: "The narrowing and generics body: the built-in narrowing constructs and their order, discriminated unions with never-based exhaustiveness, custom type predicates and generic guards, assertion functions together with the function-declaration requirement and the error it produces when broken, the control-flow-analysis failure cases (narrowing stored in a variable, narrowing across callbacks, uncorrelated optional properties), and branded types with the unique-symbol variant and validating constructors."
    notes: "metadata.tags frontmatter fields stripped. Its utility-type and type-challenge material was left out as content a capable model already has."

  - id: shipshitdev-ts-refactor
    kind: repo
    repo: shipshitdev/skills
    url: https://github.com/shipshitdev/skills/tree/master/skills/typescript-expert/references/rules
    paths: [skills/typescript-expert/references/rules]
    ref: master
    commit: cccb912bdd2f0ac33475ec39cebe1a3817c34e9d
    license: NONE
    relation: merged
    synced_at: "2026-10-15"
    contributes: "The rule inventory and its impact ordering for type architecture, narrowing, modern syntax, generics, error safety and language quirks: satisfies over annotation, interfaces over intersections, readonly by default, union literals over enums, eliminating as-casts through narrowing chains, typed catch bindings, discriminated error unions, explicit return types on exported API, distributive conditional types and how to switch distribution off, excess-property checking on literals only, and the empty-object-type trap."
    notes: "No licence file; used under the repository's permissive-attribution policy, no text copied verbatim. Four rules (arch-satisfies-over-annotation, generic-avoid-distributive-surprises, quirk-excess-property-checks, modern-verbatim-module-syntax) were checked against the TypeScript handbook and against tsc 7.0.2 before adoption; all four held. Its compiler-performance and tooling-selection rules were re-derived from the official TypeScript 6.0/7.0 release notes instead, because the upstream predates those releases. Upstream deleted the standalone typescript-refactor skill in c80ea6e and moved its 43 rule files plus _sections.md unchanged (identical blobs) into skills/typescript-expert/references/rules; url and paths follow the rules there. The rest of typescript-expert (pstack-derived material under separate licences) is not used and not tracked."

