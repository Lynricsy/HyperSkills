    commit: a6517bfbb88791f5ec52bcd62ea1668c6b5d2ac6
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The component-level Collector facts behind references/collector-pipelines.md: that memory_limiter compares against Go heap rather than process RSS so the container limit needs headroom above limit_mib, that check_interval and one of limit_mib/limit_percentage have no usable defaults and their exact validation error strings, that limit_mib silently wins when limit_percentage is also set, that spike_limit_mib must be strictly smaller, that refusal returns a non-permanent error so a receiver which does not retry loses data, that sustained refusal is an under-provisioning signal rather than a tuning problem, that the processor reports component health from 0.156 and that the middleware extension form (0.142+, Beta in 0.158) is absent from stock distributions; the snake_case component rename window across 0.146-0.154 with deprecated aliases preserved; per-component and per-signal stability levels as load-bearing when recommending production use; the otlp receiver defaulting to localhost; the exporter-side sending_queue.batch being opt-in; and the telemetrygen-plus-debug-exporter verification recipe shape that this skill's Environment section and validation gates are built on."
    notes: "Its per-component README/configuration/verification/quirks split is the structure this skill's collector reference imitates. Frontmatter needed no stripping - the skills carry only name and description. Two of its claims were treated as conventions rather than enforced rules after local testing: memory_limiter placement first in the chain is not validated by the Collector (research/observability.md ruling 3), and its position that the batch processor remains supported was adopted over the conflicting dash0 guidance (ruling 1). Its bundled lookup scripts and generated version index were not copied; this skill points at the upstream registries instead."
  - id: dash0-agent-skills
    kind: repo
    repo: dash0hq/agent-skills
    url: https://github.com/dash0hq/agent-skills
    paths:
      - skills/otel-instrumentation
      - skills/otel-collector
      - skills/otel-semantic-conventions
      - skills/otel-ottl
    ref: main
    commit: b809d934546a57c740b567014f5a0c67b906ebb5
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The instrumentation backbone: the three decisions every span needs (name, kind, status) and the low-cardinality naming table per signal; the span-kind selection rules and the recurring errors (PRODUCER for publishing rather than CLIENT, CONSUMER for processing rather than SERVER); the span-status mapping split by kind, where a 4xx on a SERVER span stays UNSET because the server answered correctly while the same 4xx on the CLIENT span is an error; OK only on confirmed success; no ERROR for retried-then-succeeded failures; recording exceptions as a log record with exception.type/message/stacktrace instead of the deprecated Span Event API; the numeric span-hygiene gates (root spans never CLIENT or PRODUCER, no parentless CLIENT/PRODUCER spans, no orphans, at most ten INTERNAL spans and twenty sub-5ms spans per trace) and the in-memory-exporter assertions for them; the manual SERVER root span for headless cron, worker and CLI operations; graceful shutdown and what SIGKILL bypasses; SDK samplers left at AlwaysOn with all sampling deferred to the Collector; the agent-plus-gateway tail-sampling architecture with loadbalancing over a headless Service and the decision_wait sizing model; materialising RED metrics from spans before any sampling step; k8sattributes pod_association ordering and its silent RBAC failure; and the rule that service identity attributes must not be upserted in a Collector."
    notes: "Its rules/*.md frontmatter (title, impact, tags) is a Dash0 convention outside the Agent Skills specification and was stripped, as were the cross-skill relative links between rule files, which docs/skill-standard.md section 4 forbids. Two of its Collector claims were refuted by local testing against otelcol-contrib 0.160.0 and are not reproduced: that an unused declared component causes a startup error (it validates and starts cleanly - research/observability.md ruling 2), and that the batch processor should not be used because it is going away (it emits no deprecation warning and remains supported - ruling 1). Its Dash0-specific material (semantic-convention upgrade strategies, the Dash0 operator, Integration Hub links) is product surface and was not used. Its citation of OTEP 4430 was verified against the specification repository rather than taken on trust."
  - id: grafana-skills
    kind: repo
    repo: grafana/skills
    url: https://github.com/grafana/skills
    paths:
      - skills/grafana-cloud/prometheus-cardinality-troubleshooter
      - skills/grafana-cloud/prometheus-label-strategy
      - skills/grafana-cloud/loki-label-analyzer
      - skills/grafana-core/alerting-irm
    ref: main
    commit: 51d33e71e191b409bbd25fc7be2684c610d18166
    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The cardinality material and its central invariant: that no label which makes a series unique can be removed at scrape or relabel time, together with the full failure mechanism - counter resets from distinct series interleave so rate() and increase() return absurdly high values, multiple samples land on one series per scrape so sample volume rises rather than falls, aggregations become wrong rather than merely coarse, and none of it produces a configuration error or leaves evidence in the data; the same reasoning extended to normalising a label value at scrape; the three safe remediations (do not emit it, drop an entire metric by __name__, aggregate post-ingest with a counter-reset-aware reversible mechanism) plus the narrow exception for a label that exactly duplicates a target label; the TSDB status endpoint fields (seriesCountByMetricName, labelValueCountByLabelName, memoryInBytesByLabelName, seriesCountByLabelValuePair) as the fastest diagnosis path and the heuristics for reading them; series-churn diagnosis via head_series_created_total against _removed_total and the cause table; the histogram bucket-count-plus-three amplification and the rule to trim labels before buckets; the per-label cardinality scoring table; static target labels versus dynamic sample labels; the info-metric pattern with group_left and the info() function; exemplars as the escape hatch; the five remediation levers in preference order; and the alert-rule YAML shape with for, severity labels and runbook_url annotations."
    notes: "Grafana Cloud product concepts (Adaptive Metrics, DPM, Active Series, Fleet Management, OnCall) were deliberately generalised: this skill describes the required mechanism - post-ingest, counter-reset-aware, audited, reversible aggregation - without naming a product, because a reader's backend may be Mimir, Thanos or a managed cloud service. The Prometheus version gates it states (native histograms 2.40+, _created 2.39+, exemplars 2.26+, info() as a 3.x experimental function behind a feature flag) were re-checked against prometheus/prometheus before being written. Its other 50-odd skills are Grafana Cloud product surface and were not used."
  - id: addyosmani-agent-skills
