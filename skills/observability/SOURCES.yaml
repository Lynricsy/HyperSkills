    synced_at: "2026-09-11"
    contributes: "The workflow framing: writing down the two-to-four questions an on-call engineer will ask before emitting any telemetry and keeping only signals that answer one; the division of labour where metrics tell you that something is wrong, traces where, and logs why, with each signal's cost profile; structured logging as events with stable low-cardinality names rather than interpolated prose; the log-level-to-on-call-action table; mandatory correlation identifiers generated at the system boundary and propagated across every hop; the rule that a log sink written by several entry points needs an entry-point field stamped where the run starts, because a correlation identifier says which run but not what started it and downstream inference is elimination against evidence that may not survive; RED for request-driven code and USE for resources; symptom-versus-cause alerting as two columns; the four rules for every alert (actionable, runbook-linked, threshold justified by an SLO or history, exactly two severities); the minimum three-line runbook and updating it when closing the incident it was used in; and the final verification step of triggering the failure path and locating it from telemetry alone without reading the source."
    notes: "Its handoffs to sibling skills for active debugging, performance optimisation and launch checklists were re-pointed: the debugging boundary is stated verbatim per docs/roadmap.md, and its performance-optimization and shipping-and-launch targets have no equivalent in this library, so those paths are omitted rather than invented. Its reference to a repository-level observability-checklist.md outside the skill directory was not followed."
