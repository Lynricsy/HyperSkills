[project]
name = "acme-orders"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["slow: takes more than a second"]
