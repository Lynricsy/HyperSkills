    license: Apache-2.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The whole strictness-ratchet workflow: remove one assigned module from the checker's exclusion list per batch, keep the change inside the owned scope, run the checker on the touched paths first for fast feedback, refuse blanket suppressions and narrow every unavoidable one to `ignore[code]` with a stated reason, validate types plus tests plus hooks separately, and split the batch instead of widening it when the error count grows."
    notes: "Its structured Batch Summary output template targets an orchestrator protocol this repository does not have; only the requirement to report each validation command's result separately was kept."

