    contributes: "The sync-versus-async decision table (CPU-bound work belongs in a process pool, mixed workloads offload with `to_thread`, small scripts stay synchronous) and the rule that one call path is either wholly sync or wholly async; the non-obvious entries from its anti-pattern list — retry logic layered at both the application and the client, a batch that silently swallows partial failures, ORM models exposed as response types; and the inventory of typing constructs worth covering (Protocol, generics, narrowing, type aliases)."
    notes: "The bulk of these skills teaches the asyncio and typing APIs themselves, which this repository's standard excludes as knowledge the model already has; those sections were dropped. Its `Result[T, E]` example carries two `# type: ignore[return-value]` comments — exactly the pattern forbidden here — and was not used."

