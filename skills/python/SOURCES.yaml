    commit: 321ccfe628eca0d314b0ee4eaffcdd8a05639aaf
    license: CC-BY-SA-4.0
    relation: merged
    synced_at: "2026-09-11"
    contributes: "Structure and checklist semantics only: the split between a single-file script, a non-distributed project and a distributable package; the argument for declaring development tooling in dependency groups rather than extras; the four migration paths (requirements.txt plus pip, setup.py, flake8 plus black plus isort, and a change of type checker) and their phase ordering; and the post-migration cleanup checklist — stale linter pragmas, orphaned tool config sections, old commands left in CI and docs."
    notes: "CC-BY-SA-4.0 is share-alike and incompatible with this repository's MIT licensing, so no prose, table, template or script was copied. Only the checklist semantics and the phase structure were taken and every sentence was written from scratch. Its templates/ and hooks/ (pre-commit config, Dependabot config, shell shims that redirect pip and python to uv) were deliberately not used. Three of its recommendations were overruled against official documentation and are not reproduced here: ty as the default type checker (Astral's own README calls ty beta), ruff `select = [\"ALL\"]` (ruff's documentation says to use ALL with discretion), and prek in place of pre-commit (single-source claim, no cross-check)."

  - id: awesome-copilot-python
