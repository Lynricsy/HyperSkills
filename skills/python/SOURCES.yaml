    ref: main
    commit: 7568a482ce2df38f8965ab5336a3220db796a4ba
    license: MIT
    relation: merged
    synced_at: "2026-09-11"
    contributes: "The packaging and release chain: src versus flat layout and the reason a flat layout hides broken installs, build backend selection, the separation of PyPI distribution name from import name, PEP 561 `py.typed`, static versus git-derived versioning, TestPyPI rehearsal, and Trusted Publishing over stored API tokens. Also the graded ruff fix loop — resolve the runner, apply safe fixes, read the diff, only then consider unsafe fixes — with the requirement that any `noqa` carries a justification, and coverage thresholds as a named verification gate."
    notes: "Its agent-binding instructions (\"read this entire file before writing code\") and its parameterised Inputs table were dropped: this repository triggers on the description and loads references on demand. The paths list covers only the three directories actually used, so `check_upstream.py` filters out this monorepo's daily churn."

  - id: getsentry-typing
    kind: repo
    repo: getsentry/skills
    url: https://github.com/getsentry/skills/tree/main/skills/typing-exclusion-worker
    paths: [skills/typing-exclusion-worker]
    ref: main
