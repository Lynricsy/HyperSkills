    synced_at: "2026-09-11"
    contributes: "The inverse checklist — legitimate patterns that must not be reported as findings (`cast()` after a runtime check, an empty `__init__.py`, `Any` at the boundary with an untyped dependency, a justified suppression) and rules that only apply under stated conditions. From its pytest half: `patch` targets the namespace that resolves the name, awaited dependencies need `AsyncMock` rather than `Mock`, yield-fixture cleanup, fixture scope, and test isolation as the explanation for a file that passes alone and fails in the suite."
    notes: "Its cross-skill relative links to a sibling verification-protocol skill were stripped. Its PEP 8 79-column rule was overruled: with ruff configured, line length is the project's setting and defaults to 88."

