# VM 内 omp 的全局配置。与宿主配置无关：只保留评测需要的最小集合。
# 已完成首次引导，交互式 omp 不再弹设置向导。
setupVersion: 2
modelRoles:
  # 与 tools/run_evals.py 的默认评测模型一致；评测运行仍显式传 --model / --thinking。
  default: openai/gpt-6.1-sol:medium
  # smol 必须显式指定：未设置或解析不到时 omp 按内置优先级表选 smol，在 openai provider 下
  # 落到已下线的 gpt-5.3-codex-spark。每次挂载 skill 的运行都会用 smol 压缩 skill 描述，
  # 失败请求累积会触发网关熔断（日志 0089）。workbuddy provider 由 tools/vm.py 每次写进
  # models.yml（凭据经 msb secret 注入），缺凭据时 vm.py 直接拒绝启动。
  smol: workbuddy/deepseek-v4.1-flash
# advisor 是第二个模型，会审阅每一轮并注入建议；开着就测成了模型组合（日志 0078）。
advisor:
  enabled: false
memory:
  backend: "off"
skills:
  # 被测 skill 由 tools/vm.py 只读挂到这里；基线运行不挂载任何东西。
  customDirectories:
    - /opt/hyperskills/skills
