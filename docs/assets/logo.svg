<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="HyperSkills">
  <!-- 透明底 + 中调色：同一份资产在 #ffffff 与 #0d1117 上都有对比度，不依赖会被 GitHub 剥离的 CSS 媒体查询 -->
  <!-- 耳朵先画，露在头顶轮廓之上 -->
  <path d="M27 26 L21 7 L42 19 Z" fill="#D9752E" stroke="#D9752E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M69 26 L75 7 L54 19 Z" fill="#D9752E" stroke="#D9752E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M28 23 L25 13 L36 20 Z" fill="#F6C177"/>
  <path d="M68 23 L71 13 L60 20 Z" fill="#F6C177"/>
  <!-- 脸：向下收的圆角三角 -->
  <path d="M27 26 H69 L48 59 Z" fill="#E9873F" stroke="#E9873F" stroke-width="6" stroke-linejoin="round"/>
  <!-- 眼与鼻：对比度对着脸上的琥珀色，不对着页面底色，所以两种主题都成立 -->
  <circle cx="38" cy="34" r="3.4" fill="#2E2A3A"/>
  <circle cx="58" cy="34" r="3.4" fill="#2E2A3A"/>
  <path d="M48 49 L43.6 43 L52.4 43 Z" fill="#2E2A3A"/>
  <!-- 三张错开的卡片后画，盖住下巴：一个 skill 一份成稿，狐狸从稿堆后探出来 -->
  <rect x="12" y="58" width="56" height="9" rx="4.5" fill="#C4B5FD"/>
  <rect x="20" y="69" width="56" height="9" rx="4.5" fill="#A78BFA"/>
  <rect x="28" y="80" width="56" height="9" rx="4.5" fill="#7C6BF2"/>
</svg>
